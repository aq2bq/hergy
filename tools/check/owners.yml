# The owners gate's exceptions (tools/check/owners.go, r-ea17 / ac-f62f / d-4d88).
#
# enforce: false prints the findings and passes, so copies can be merged before
# the gate fails. done is enforce: true with no finding.
enforce: true
#
# Every entry needs the path, the name, why the owner is not the place for it,
# and the decision that allowed it (gy's d-…). An entry without all four fails
# the gate before the code is read.
allow:
  - path: internal/app/app.go
    name: Counts
    why: 動いているチームの人数と作業者を数える、一覧の行とは別の数え上げ（status.Counts）
    decision: d-4d88
  - path: internal/status/status.go
    name: Counts
    why: 動いているチームの人数と作業者を数える、一覧の行とは別の数え上げ（上の呼び出しの定義）
    decision: d-4d88
