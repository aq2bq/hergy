version: 1
profiles:
  sonnet-fast:
    kind: claude
    args: ["--model", "claude-sonnet-5-5"]
    env:
      MAX_THINKING_TOKENS: '8000'
  opus-deep:
    kind: claude
    args: ["--model", "claude-opus-5-5", "--effort", "high"]
  fable-review:
    kind: claude
    args: ["--model", "claude-fable-5-1", "--effort", "high"]
  haiku-chore:
    kind: claude
    args: ["--model", "claude-haiku-5-5", "--effort", "low"]
  codex-high:
    kind: codex
    args: ["-m", "gpt-5.5-codex", "-c", "model_reasoning_effort=high", "-c", "sandbox_mode=workspace-write", "-c", "approval_policy=on-request"]
    env:
      CODEX_HOME: '~/.codex-team'
  codex-mini:
    kind: codex
    args: ["-m", "gpt-5.5-codex-mini", "-c", "model_reasoning_effort=low"]
  opencode-deepseek:
    kind: opencode
    args: ["--standalone"]
    env:
      OPENCODE_CONFIG_CONTENT: '{"$schema":"https://opencode.ai/config.json","model":"opencode-go/deepseek-v4.1-flash","small_model":"opencode-go/deepseek-v4.1-flash","provider":{"opencode-go":{"options":{"timeout":600000},"models":{"deepseek-v4.1-flash":{"name":"DeepSeek V4.1 Flash","limit":{"context":262144,"output":65536},"options":{"temperature":0.2,"top_p":0.9}},"deepseek-v4.1":{"name":"DeepSeek V4.1","limit":{"context":262144,"output":65536},"options":{"temperature":0.1,"reasoningEffort":"high"}}}}},"agent":{"build":{"mode":"primary","model":"opencode-go/deepseek-v4.1-flash","temperature":0.2,"tools":{"write":true,"edit":true,"bash":true,"webfetch":false}},"plan":{"mode":"primary","model":"opencode-go/deepseek-v4.1","temperature":0.1,"tools":{"write":false,"edit":false,"bash":false}},"review":{"mode":"subagent","description":"差分を読んで指摘だけ返す","temperature":0.1,"tools":{"write":false,"edit":false}}},"permission":{"edit":"allow","bash":{"git push*":"deny","rm -rf*":"deny","go test*":"allow","go vet*":"allow","make lint*":"allow","go mod tidy*":"allow","git diff*":"allow","git status*":"allow","*":"ask"},"webfetch":"deny"},"mcp":{"search":{"type":"remote","url":"https://mcp.example.com/search","enabled":true,"headers":{"X-Client":"sample-shop"}},"browser":{"type":"local","command":["npx","-y","example-browser-mcp@1.4.2"],"enabled":false,"environment":{"HEADLESS":"1"}}},"lsp":{"gopls":{"command":["gopls","serve"],"extensions":[".go"],"initialization":{"staticcheck":true,"gofumpt":false,"usePlaceholders":true}},"typescript":{"disabled":true}},"watcher":{"ignore":["node_modules/**","dist/**",".git/**","tmp/**","coverage/**"]},"formatter":{"gofmt":{"command":["gofmt","-w","$FILE"],"extensions":[".go"]},"prettier":{"disabled":true}},"instructions":["AGENTS.md","docs/conventions.md","docs/review-checklist.md"],"share":"disabled","autoupdate":false,"keybinds":{"leader":"ctrl+x","session_new":"<leader>n","session_list":"<leader>l","model_list":"<leader>m"},"tui":{"scroll_speed":3},"experimental":{"disable_paste_summary":true}}'
      OPENCODE_DISABLE_AUTOUPDATE: '1'
  gemini-pro:
    kind: gemini
    args: ["-m", "gemini-3-pro", "--approval-mode", "auto_edit"]
    env:
      GEMINI_SANDBOX: 'false'
