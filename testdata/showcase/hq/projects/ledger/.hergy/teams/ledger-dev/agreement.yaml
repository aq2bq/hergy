version: 1
title: ledger-dev チームの約束
revision: 3
sections:
  - heading: 進め方
    rules:
      - id: LD-1
        text: '仕事は台帳の要求 1 つから始め、決めた理由と決めなかった案を 1 つずつ添えて台帳に残す。'
      - id: LD-2
        text: 'ターンを渡すときは、相手に求めることを 1 文で書き、読むファイルのパスと要求の ID を添える。'
      - id: LD-3
        text: '返事を待つ間に、別の要求へ手を付けない。待つ時間が長くなりそうなら、待っている理由を lead に 1 行で知らせる。'
        note: '由来: instruction 2026-09-03 d-2b10'
      - id: LD-4
        text: '要求の範囲が広がりそうになったら手を止め、広がる分を別の要求として台帳に書いてから、lead に順番を聞く。'
  - heading: 差分の見せ方
    rules:
      - id: LD-5
        text: '差分は、変わる前と変わった後を同じ行の高さで並べる。 行がずれた差分の画面で、読む人が別の行の金額を取り違えた。'
        note: '由来: incident 2026-09-18 d-3c41'
      - id: LD-6
        text: '金額の差は、符号と通貨の単位を付けて出す。差が 0 の行は空欄にせず「0」と書く。'
      - id: LD-7
        text: '1 画面に収まらない差分は、変わった行のまわり 3 行だけを残して畳み、畳んだ行の数を見出しに書く。'
      - id: LD-8
        text: '色だけで増減を伝えない。増えた行と減った行には、＋と－の記号も付ける。'
        note: '由来: derived  LD-5'
  - heading: データの扱い
    rules:
      - id: LD-9
        text: '見本の台帳は本物の取引を写さず、件数と形だけを合わせて作る。'
      - id: LD-10
        text: '差分の計算では台帳を読むだけにし、差分を出すために台帳へ書き込まない。'
      - id: LD-11
        text: '1 万行を超える台帳でも差分が 1 秒以内に出ることを、変更のたびに測る。'
      - id: LD-12
        text: '通貨の端数は計算の途中で丸めず、画面に出すときに 1 回だけ丸める。 途中で丸めた差分が、合計で 1 円ずれた。'
        note: '由来: incident 2026-09-25 d-41f7'
  - heading: 実装
    rules:
      - id: LD-13
        text: '1 つの要求は 1 人が実装する。同じファイルを触る要求は、前の要求が取り込まれてから始める。'
      - id: LD-14
        text: '作業はそれぞれのワークツリーで終え、main には lead が取り込む。'
        note: '由来: instruction 2026-09-03 d-2b10'
      - id: LD-15
        text: '変更には、その変更が無いと落ちるテストを 1 つ以上付ける。'
      - id: LD-16
        text: '新しい依存を足すときは、足す理由と、足さずに書いた場合の形を lead に見せてから足す。'
  - heading: レビュー
    rules:
      - id: LD-17
        text: 'reviewer は要求の終わりの条件を先に読み、その条件で差分を見る。'
      - id: LD-18
        text: '指摘は「どこが・なぜ・どう直すか」を 1 件ずつ書く。好みの違いは指摘にしない。'
      - id: LD-19
        text: '差し戻しは lead が受け取り、要求の言葉に直してから builder に渡す。'
      - id: LD-20
        text: '同じ指摘が 2 回出たら、規則にできるかを lead に提案する。'
        note: '由来: derived  LD-18'
  - heading: テスト
    rules:
      - id: LD-21
        text: 'tester は要求の終わりの条件を、手で動かせる手順に書き直してから試す。'
      - id: LD-22
        text: '試した結果は、手順・期待した結果・実際の結果の 3 つを並べて書く。'
      - id: LD-23
        text: '落ちた試験は直るまで消さない。飛ばすときは、飛ばす理由と期限を書く。'
      - id: LD-24
        text: '2 つ前の版のブラウザでも、差分の画面が崩れないことを確かめる。'
  - heading: 人間とのやりとり
    rules:
      - id: LD-25
        text: '人間と話すのは lead だけにする。人間に伝えるのは、人間が決めることと、人間の番が回ってきたことの 2 つだけにする。'
      - id: LD-26
        text: '人間への問いは 1 回に 1 つにし、選択肢とおすすめを 1 つ添える。答えの形（はい・いいえ、どれか 1 つ）を問いの中に書く。'
      - id: LD-27
        text: '人間に見せる前に、lead が自分で差分の画面を動かして確かめる。builder の「できた」だけでは見せない。'
        note: '由来: incident 2026-10-02 d-5e08'
      - id: LD-28
        text: '人間が差分の画面に求めた直しは、その場で要求にして ID を人間に返す。'
  - heading: 終わり方
    rules:
      - id: LD-29
        text: '要求は、終わりの条件を測った値と一緒に閉じる。'
      - id: LD-30
        text: '1 日の終わりに、開いている要求と止まっている要求を、止まっている理由と一緒に台帳へ 3 行以内で残す。'
      - id: LD-31
        text: '使い終わったワークツリーとワーカーのタブは、要求を閉じるときに片付ける。'
