version: 1
title: ledger-search チームの約束
revision: 3
sections:
  - heading: 進め方
    rules:
      - id: LS-1
        text: '仕事は台帳の要求 1 つから始め、決めた理由と決めなかった案を 1 つずつ添えて台帳に残す。'
      - id: LS-2
        text: 'ターンを渡すときは、相手に求めることを 1 文で書き、読むファイルのパスと要求の ID を添える。'
      - id: LS-3
        text: '返事を待つ間に、別の要求へ手を付けない。待つ時間が長くなりそうなら、待っている理由を lead に 1 行で知らせる。'
        note: '由来: instruction 2026-09-03 d-2b10'
      - id: LS-4
        text: '人間への問いは 1 回に 1 つにし、選択肢とおすすめを 1 つ添える。答えの形（はい・いいえ、どれか 1 つ）を問いの中に書く。'
  - heading: 調べる
    rules:
      - id: LS-5
        text: 'scout は検索の仕組みを 3 つまで比べ、比べた観点を表にして lead に渡す。'
      - id: LS-6
        text: '調べたことは、出典の URL と読んだ日付と一緒に残す。'
      - id: LS-7
        text: '調べる時間は 1 つの問いにつき 2 時間までにする。超えそうなら、わかったところまでを lead に渡す。'
      - id: LS-8
        text: '試しに動かす仕組みは作業用の環境で動かし、本番の台帳には繋がない。'
  - heading: 検索の質
    rules:
      - id: LS-9
        text: '検索の正しさは、決めておいた 50 個の問いと、期待する答えの表で測る。'
      - id: LS-10
        text: '表の問いには、利用者が実際に打つ言葉（略語、全角と半角の混ざった語）を入れる。'
      - id: LS-11
        text: '変更のたびに、表の正しさが前より下がっていないことを確かめる。下がったら取り込まない。 速くする変更で、よく使う略語が見つからなくなった。'
        note: '由来: incident 2026-10-06 d-6a12'
      - id: LS-12
        text: '結果が 0 件のときは、言葉を変える案を出す。空の画面だけを出さない。'
  - heading: 速さ
    rules:
      - id: LS-13
        text: '検索の答えは、10 万件の台帳で 0.3 秒以内に返す。変更のたびに測る。'
      - id: LS-14
        text: '索引の作り直しは、利用者の少ない夜にだけ走らせる。'
      - id: LS-15
        text: '索引の大きさが台帳の 2 倍を超えたら、lead に知らせる。'
  - heading: 実装
    rules:
      - id: LS-16
        text: '1 つの要求は 1 人が実装し、作業はそれぞれのワークツリーで終える。'
      - id: LS-17
        text: '索引の形を変えるときは、古い索引から作り直す手順も一緒に書く。'
      - id: LS-18
        text: '変更には、その変更が無いと落ちるテストを 1 つ以上付ける。'
      - id: LS-19
        text: '取り込みは、CI が通ってから lead がする。'
  - heading: 終わり方
    rules:
      - id: LS-20
        text: '要求は、表の正しさと速さを測った値と一緒に閉じる。'
      - id: LS-21
        text: '1 日の終わりに、開いている要求と止まっている理由を台帳へ 3 行以内で残す。'
      - id: LS-22
        text: '使い終わった作業用の環境は、要求を閉じるときに片付ける。'
