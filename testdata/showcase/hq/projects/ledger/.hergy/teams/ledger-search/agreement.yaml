        text: ledger-searchの決めごと 1。仕事は台帳の要求 1 つから始め、決めた理由と決めなかった案を 1 つずつ添える。渡す相手には求めることを 1 文で書き、読むファイルのパスと台帳の ID も添える。返事を待つ間に別の要求へ手を付けない。
