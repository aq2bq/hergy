version: 1
title: ledger-ops チームの約束
revision: 3
sections:
  - heading: 進め方
    rules:
      - id: LO-1
        text: '仕事は台帳の要求か障害の記録 1 つから始める。'
      - id: LO-2
        text: 'ターンを渡すときは、相手に求めることを 1 文で書き、読むファイルのパスと記録の ID を添える。'
      - id: LO-3
        text: '本番に触る作業は operator が 1 人で行い、reviewer が手順を先に読む。'
        note: '由来: instruction 2026-09-05 d-2d33'
      - id: LO-4
        text: '人間と話すのは lead だけにする。'
  - heading: リリース
    rules:
      - id: LO-5
        text: 'リリースは平日の午前に限る。金曜の午後と休みの前の日には出さない。 金曜の夕方に出したリリースが壊れ、休みの間に誰も戻せなかった。'
        note: '由来: incident 2026-09-13 d-33a9'
      - id: LO-6
        text: 'リリースの前に戻し方を 1 行で書き、その戻し方を作業用の環境で 1 回試す。'
      - id: LO-7
        text: 'リリースの手順は、打つコマンドをそのまま写せる形で残す。'
      - id: LO-8
        text: 'リリースのあと 30 分は、エラーの数と応答の遅さを見続け、悪くなったら戻す。'
  - heading: 障害の対応
    rules:
      - id: LO-9
        text: '障害に気づいたら、直す前に、いつから・何が・どれくらいの人に起きているかを 3 行で書く。'
      - id: LO-10
        text: '障害の対応では、まず元に戻す。原因を探すのは戻したあとにする。'
      - id: LO-11
        text: '利用者への知らせは lead が人間に頼む。operator は直接出さない。'
      - id: LO-12
        text: '障害が終わったら 2 日以内に振り返りを書き、次から防ぐ規則の案を 1 つ出す。'
        note: '由来: derived  LO-9'
  - heading: 権限と秘密
    rules:
      - id: LO-13
        text: '本番の鍵は作業のたびに借り、終わったらすぐ返す。'
      - id: LO-14
        text: 'ログと報告に、鍵・パスワード・利用者の個人情報を書かない。'
      - id: LO-15
        text: '権限を広げるときは、広げる理由と期限を書いて lead の許しを得る。'
  - heading: 記録
    rules:
      - id: LO-16
        text: '本番で打ったコマンドは、時刻と結果と一緒に記録へ残す。'
      - id: LO-17
        text: '1 日の終わりに、出したリリースと開いている障害を 3 行以内で残す。'
      - id: LO-18
        text: '同じ障害が 2 回起きたら、直すための要求を立てる。'
