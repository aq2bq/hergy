version: 1
title: 設計実装
revision: 2
sections:
  - heading: 作り方
    rules:
      - id: BUILD-1
        text: '同じファイルを触る要求は、前の要求が取り込まれてから始める。'
      - id: BUILD-2
        text: '作業は自分のワークツリーで終え、main には触らない。'
      - id: BUILD-3
        text: '変更には、その変更が無いと落ちるテストを 1 つ以上付ける。'
      - id: BUILD-4
        text: '金額を扱うコードでは小数の型を使わず、いちばん小さい単位の整数で持つ。 小数で持った金額の合計が、1 円ずれた。'
        note: '由来: incident 2026-09-25 d-41f7'
  - heading: 渡し方
    rules:
      - id: BUILD-5
        text: '終わりの条件を満たしたことは、測った値かコマンドの結果で lead に伝える。「できた」だけで渡さない。'
      - id: BUILD-6
        text: '要求に書かれていない変更をしたくなったら、手を止めて lead に聞く。'
