version: 1
title: 要求定義
revision: 2
sections:
  - heading: 要求の書き方
    rules:
      - id: AN-1
        text: '配信の速さは、どの地域のどの時間帯かと一緒に測る。'
      - id: AN-2
        text: '要求の終わりの条件は、測れる数（何秒以内、何 % 以上）で書く。'
      - id: AN-3
        text: '利用者の困りごとを聞いたら、困っている場面を 1 文に書いてから要求にする。'
      - id: AN-4
        text: '1 つの要求には、終わりの条件を 3 つまでにする。'
  - heading: 決めないこと
    rules:
      - id: AN-5
        text: '要求どうしがぶつかるときは、どちらを先にするかを lead に聞く。自分では決めない。'
