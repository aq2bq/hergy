version: 1
title: 進行管理
revision: 2
sections:
  - heading: 使命
    rules:
      - id: LEAD-1
        text: '地図の配信を速くする要求だけを、このチームで扱う。それ以外の要求は人間に返す。'
      - id: LEAD-2
        text: '人間と話すのは lead だけにする。'
  - heading: 払い出し
    rules:
      - id: LEAD-3
        text: '要求を受けたら、速くする対象（地域・拡大の段・時間帯）を書き添えて台帳に記録する。'
      - id: LEAD-4
        text: '実装は 1 つの要求に 1 人で払い出す。'
  - heading: 見せる前の確認
    rules:
      - id: LEAD-5
        text: '速くなったと人間に伝える前に、lead が自分で前と後を測り直す。'
        note: '由来: incident 2026-10-04 d-5f21'
