version: 1
title: atlas-dev チームの約束
revision: 3
sections:
  - heading: 進め方
    rules:
      - id: AT-1
        text: '仕事は台帳の要求 1 つから始め、決めた理由と決めなかった案を 1 つずつ添えて台帳に残す。'
      - id: AT-2
        text: 'ターンを渡すときは、相手に求めることを 1 文で書き、読むファイルのパスと要求の ID を添える。'
      - id: AT-3
        text: '返事を待つ間に、別の要求へ手を付けない。待つ時間が長くなりそうなら、待っている理由を lead に 1 行で知らせる。'
        note: '由来: instruction 2026-09-03 d-2b10'
      - id: AT-4
        text: '要求の範囲が広がりそうになったら手を止め、広がる分を別の要求として台帳に書いてから、lead に順番を聞く。'
  - heading: 測る
    rules:
      - id: AT-5
        text: '配信の速さは、地域と時間帯を書き添えて測る。1 つの数だけで速くなったと言わない。'
      - id: AT-6
        text: '速さは、真ん中の値と、遅いほうから 5% の値の 2 つで書く。'
      - id: AT-7
        text: '変える前にいまの値を 3 回測って残し、変えたあとも同じ条件で 3 回測る。'
        note: '由来: derived  AT-5'
      - id: AT-8
        text: '測った値は、測ったコマンドと一緒に残す。誰が測っても同じ測り方になるようにする。'
  - heading: タイル
    rules:
      - id: AT-9
        text: 'タイルの形式を変えるときは、2 つ前の版の端末でも読めることを確かめる。 新しい形式に替えたら、古い端末で地図が白くなった。'
        note: '由来: incident 2026-09-22 d-3f50'
      - id: AT-10
        text: 'タイルを小さくする変更は、前と後の見た目を並べた画像で lead に見せる。'
      - id: AT-11
        text: '拡大の段ごとに、タイルの数と大きさの合計を記録する。'
      - id: AT-12
        text: '地図のデータの元は変えない。速くするのは、配り方とタイルの作り方だけにする。'
  - heading: キャッシュ
    rules:
      - id: AT-13
        text: 'キャッシュの期限を変えるときは、古いタイルが何分残るかを書き添える。'
      - id: AT-14
        text: 'キャッシュを消すときは地域を限り、全体を一度に消さない。 全体のキャッシュを消したら、元のサーバーが朝の混む時間に落ちた。'
        note: '由来: incident 2026-10-01 d-4b77'
      - id: AT-15
        text: 'キャッシュに当たった割合を毎日 1 回記録し、下がったら原因を調べる要求を立てる。'
      - id: AT-16
        text: 'キャッシュの設定は、本番に入れる前に作業用の環境で 1 日動かす。'
  - heading: 実装
    rules:
      - id: AT-17
        text: '1 つの要求は 1 人が実装する。同じファイルを触る要求は、前の要求が取り込まれてから始める。'
      - id: AT-18
        text: 'builder の変更は reviewer が読んでから lead に渡す。'
      - id: AT-19
        text: '速くする変更には、速さを測るテストを 1 つ付ける。'
      - id: AT-20
        text: '取り込みは、CI が通ってから lead がする。'
  - heading: 人間とのやりとり
    rules:
      - id: AT-21
        text: '人間と話すのは lead だけにする。人間に伝えるのは、人間が決めることと、人間の番が回ってきたことの 2 つだけにする。'
      - id: AT-22
        text: '人間への問いは 1 回に 1 つにし、選択肢とおすすめを 1 つ添える。答えの形（はい・いいえ、どれか 1 つ）を問いの中に書く。'
      - id: AT-23
        text: '人間に見せる前に、lead が自分で地図を動かして確かめる。'
      - id: AT-24
        text: '速くなったと伝えるときは、前と後の値を並べて書く。'
  - heading: 終わり方
    rules:
      - id: AT-25
        text: '要求は、測った値と一緒に閉じる。'
      - id: AT-26
        text: '1 日の終わりに、開いている要求と止まっている理由を台帳へ 3 行以内で残す。'
      - id: AT-27
        text: '使い終わったワークツリーとワーカーのタブは、要求を閉じるときに片付ける。'
