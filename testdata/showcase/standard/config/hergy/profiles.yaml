version: 1
profiles:
  sonnet-fast:
    kind: claude
    args: ["--model", "claude-sonnet-5-5", "--effort", "medium"]
  opus-plan:
    kind: claude
    args: ["--model", "claude-opus-5-5", "--effort", "max"]
  codex:
    kind: codex
  opencode-local:
    kind: opencode
    args: ["--standalone"]
    env:
      OPENCODE_CONFIG_CONTENT: '{"model":"ollama/qwen3-coder:30b","provider":{"ollama":{"npm":"@ai-sdk/openai-compatible","options":{"baseURL":"http://127.0.0.1:11434/v1"},"models":{"qwen3-coder:30b":{}}}}}'
