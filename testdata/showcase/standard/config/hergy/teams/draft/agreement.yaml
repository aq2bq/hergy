version: 1
title: draft チームの約束
revision: 1
sections:
  - heading: 下書き
    rules:
      - id: DRAFT-1
        text: 下書きは、読み手と、読み終えた読み手にしてほしいことを 1 行で書いてから始める。
        note: '由来: instruction 2026-09-25 d-40a2'
      - id: DRAFT-2
        text: 1 つの下書きは 1 つの話にする。話が 2 つになったら、下書きを分ける。
      - id: DRAFT-3
        text: 読み合わせで決めきれない語があれば、reader → 人間 で尋ねる。下書きの中で語を決めない。 読み合わせの中で語を決め、あとで用語集と食い違った。
        note: '由来: incident 2026-09-29 d-40b7'
  - heading: 読み合わせ
    rules:
      - id: DRAFT-4
        text: 読み合わせの指摘は、下書きの段落ごとに返す。段落をまたぐ指摘は、最後にまとめて書く。
      - id: DRAFT-5
        text: 読み合わせを 3 往復しても決まらない所は、両方の案を並べて人間に渡す。
