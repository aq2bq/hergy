version: 1
title: research チームの約束
revision: 2
sections:
  - heading: 進め方
    rules:
      - id: RES-1
        text: 調べる問いは lead が台帳に 1 つずつ立てる。台帳に無い問いを調べ始めず、思い付いた問いは台帳に足してから順番を問う。
      - id: RES-2
        text: 調べる前に、問いを 1 文で書き、答えが出たら何が決まるかを添える。決まるものが無い調査は始めない。
        why: 答えが出ても何も決まらない調査に半日を使った。
        origin:
          - kind: incident
            date: "2026-10-07"
            refs: [d-9b11]
      - id: RES-3
        text: 調べた結果は、問いの記録に 1 つの文書としてつなぐ。会話の中だけに結果を書かず、主張ごとに出典を付ける。
        origin:
          - kind: instruction
            date: "2026-10-06"
            refs: [d-9a70]
      - id: RES-4
        text: 検索の改善案は、いまの検索で利用者が困っている場面に結び付けて書く。場面の無い案は「場面なし」と書いて分け、案の数に数えない。
        why: 技術として面白い案ばかりが集まり、どれも利用者の困りごとに結び付かなかった。
      - id: RES-5
        text: 試作はワーカーに頼んでよいが、試作の結果をどう読むかは scout が書く。試作のコードは調査の文書に貼らず、置き場所だけを書く。
      - id: RES-6
        text: scout が人間に直接見せるのは、計測の結果だけにする（scout → 人間）。見せるときは、計測の条件と、比べた相手の数字を並べる。
  - heading: 終わり
    rules:
      - id: RES-7
        text: 1 つの問いにかける時間は半日までにする。半日で答えが出なければ、分かったことと分からないことを書いて lead に返す。
      - id: RES-8
        text: 提案は 1 つの問いにつき 1 つにする。複数の案を並べるときは、どれを勧めるかを最初の行に書き、勧めない理由も 1 行ずつ書く。
      - id: RES-9
        text: 調べ終えた問いは、lead が台帳で閉じる。閉じるときは、決まったことと、次に調べたほうがよい問いを書く。
