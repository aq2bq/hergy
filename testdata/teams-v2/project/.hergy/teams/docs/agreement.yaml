version: 1
title: docs チームの約束
revision: 4
sections:
  - heading: 進め方
    rules:
      - id: DOCS-1
        text: 仕事は台帳の要求 1 つから始め、台帳に書いてから動く。会話の中にしかない合意は無いものとして扱い、決めたことは決めた人の名前と一緒に台帳へ残す。台帳に書くときは、決めた理由と、決めなかった案を 1 つずつ添える。
        why: 口頭で決めたことが翌日には誰の記憶にも残っておらず、同じ議論をもう一度した。
        origin:
          - kind: incident
            date: "2026-08-12"
            refs: [d-1a20]
      - id: DOCS-2
        text: 次に動く人へターンを渡すときは、相手に求めることを 1 文で添える。相手が会話を読まずに着手できるよう、読むファイルのパスと台帳の ID も書く。渡したあとで相手から問いが返ってきたら、その問いに答えられる文を、次に渡すときの手本として台帳に残す。
        why: 渡す文だけでは何をすればよいか分からず、受け手が会話を遡って半日を使った。
        origin:
          - kind: instruction
            date: "2026-08-12"
            refs: [d-1a20]
      - id: DOCS-3
        text: ターンを渡したら、相手の返事を待つ間に別の要求へ手を付けない。待つ時間が長くなりそうなら、待っている理由を台帳に 1 行書いて lead に知らせる。返事を待っているあいだに見つけたことは、台帳に書いて置き、ターンが戻ってから続ける。
        why: 返事を待つ間に始めた別の要求が、戻ってきたターンと同じファイルを触っていた。
      - id: DOCS-4
        text: 人間への問いは 1 回に 1 つにし、選択肢を 2 つか 3 つ並べて、おすすめを 1 つ添える。答えの形（はい・いいえ、どれか 1 つ）を問いの中に書く。人間が答えるまでに知っておく必要のある前提（いまの状態、選んだ場合に起きること）も 3 行以内で添える。
        why: 一度に 5 つ尋ね、どれにも答えが返ってこなかった。
        origin:
          - kind: incident
            date: "2026-08-20"
            refs: [d-1c02]
      - id: DOCS-5
        text: 要求の範囲が途中で広がりそうになったら、広げずに手を止め、広がる分を別の要求として台帳に書いてから lead に順番を問う。広げた分を同じ要求の中で片付けてしまうと、終わりの判定ができなくなる。
        why: 途中で広げた要求が終わらず、元の要求まで 1 週間止まった。
      - id: DOCS-6
        text: 同じ問いを 2 回しない。前に答えが出ている問いは台帳の答えを引いて済ませ、引いた記録の ID を返事に添える。台帳の答えが古くなっていると思ったら、答えを引いたうえで、何が変わったかを添えて問い直す。
        origin:
          - kind: derived
            refs: [DOCS-4]
      - id: DOCS-7
        text: 1 日の終わりに、開いている要求と止まっている要求を、止まっている理由と一緒に台帳へ 3 行以内で残す。翌朝はその 3 行から始める。3 行は「何をしていたか」「何で止まっているか」「明日まず何をするか」の順に書く。
        why: 翌朝、前の日にどこで止まったかを誰も覚えておらず、同じ調べ物をやり直した。
      - id: DOCS-8
        text: 見積もりは、似た要求にかかった実際の時間を台帳から引いて出す。引ける記録が無いときは「記録なし」と書き、勘の数字を書かない。見積もりには、どの記録から引いたかの ID を添え、似ていない所があれば 1 行で書く。
        why: 勘で出した見積もりが 3 倍外れ、人間の予定が崩れた。
        origin:
          - kind: incident
            date: "2026-09-09"
            refs: [d-2c71]
  - heading: 文書
    rules:
      - id: DOCS-9
        text: 文書の変更は 1 つの要求に 1 つの差分にする。体裁の直しと中身の直しを同じ差分に混ぜない。
      - id: DOCS-10
        text: 利用者向けの文書には、画面の文字とコマンドの出力を、いまの版で実際に出したものから写す。記憶で書かない。
        why: 前の版の画面の文字が文書に残っていて、利用者がボタンを見つけられなかった。
        origin:
          - kind: incident
            date: "2026-09-03"
            refs: [d-2b17]
      - id: DOCS-11
        text: 下書きができたら writer が checker に渡し、checker は読み通した結果を返す（writer ⇄ checker）。
      - id: DOCS-12
        text: 手順の文書は、書いた人以外が 1 回その通りに動かして確かめる。確かめた人の名前と日付を差分に添える。
      - id: DOCS-13
        text: リンクは公開する前にすべて開いて確かめる。開けないリンクは消すか、置き換え先を書く。確かめはワーカーに頼んでよい。
      - id: DOCS-14
        text: 翻訳は原文が確定してから頼む。原文を直したら、訳の古い所に印を付け、印が消えるまで訳を公開しない。
        why: 原文を直したあとも古い訳が公開されたままで、手順が食い違った。
      - id: DOCS-15
        text: 図は文の代わりに使わない。図に描いたことは本文にも 1 文で書き、図が読めない人にも同じことが伝わるようにする。
      - id: DOCS-16
        text: 公開の判断は人間がする。writer が人間に見せるときは（writer → 人間）、公開する文書の一覧と、前の版から変わった所を添える。
        origin:
          - kind: instruction
            date: "2026-09-08"
            refs: [d-2b30]
  - heading: 作業の場所
    rules:
      - id: DOCS-17
        text: 作業はそれぞれのワークツリーで行い、終わったら lead に取り込みを頼む。main には lead 以外が触らない。ワークツリーは要求ごとに 1 つ作り、ほかの要求の変更を混ぜない。取り込みが済むまで、同じワークツリーで次の要求を始めない。
        why: main で直接直した変更が、取り込み中の別の変更とぶつかり、両方をやり直した。
        origin:
          - kind: instruction
            date: "2026-08-14"
            refs: [d-4c11]
      - id: DOCS-18
        text: 同じファイルを 2 人が同時に直さない。触る前に台帳でそのファイルの名前を探し、ほかの人の作業中なら lead に順番を問う。順番待ちの間は、ほかのファイルで進められる作業を探し、見つからなければ待っていると台帳に書く。
        why: 2 人が同じ移行ファイルを並行して直し、片方の変更が取り込みで消えた。
        origin:
          - kind: incident
            date: "2026-09-20"
            refs: [d-58e2]
      - id: DOCS-19
        text: ワークツリーの名前は要求の ID にする。終わった要求のワークツリーは、取り込みのあと片付けるまで消さない。片付ける前に、取り込み済みのコミットとワークツリーの先頭が一致しているかを確かめる。
      - id: DOCS-20
        text: 手で動かす確かめは、作業用のディレクトリで設定の置き場所を差し替えてから行う。人の設定ファイルとホームディレクトリの中身を読みに行かない。確かめに使った作業用のディレクトリの場所は実装記録に書き、確かめが終わったら消す。
        why: 確かめのために動かしたコマンドが、人の設定ファイルを書き換えた。
        origin:
          - kind: incident
            date: "2026-09-02"
            refs: [d-2f18]
      - id: DOCS-21
        text: 依存するパッケージを足すときは、足す理由と、足さずに済ませる案を 1 つずつ台帳に書いてから足す。版は固定し、範囲で書かない。足したパッケージの許諾の種類を確かめ、確かめた結果を台帳の同じ記録に書く。
        why: 足した依存の版が範囲で書かれていて、ある日の取り込みから急に壊れた。
      - id: DOCS-22
        text: 生成したファイルとビルドの結果はコミットしない。消してもコマンド 1 つで作り直せるものは、作り直す手順だけを文書に残す。作り直しに時間がかかるものは、かかる時間と、作り直すときに要るものを手順と一緒に書く。
  - heading: 安全
    rules:
      - id: DOCS-23
        text: 本番のデータベースには誰も直接つながない。調べたいことがあれば写しのデータベースで調べ、使った問い合わせを台帳に残す。写しのデータベースには本物の利用者の情報が入っていないことを、使う前に確かめる。
        why: 調べるつもりでつないだ本番のデータベースに、書き込みの問い合わせを流しかけた。
        origin:
          - kind: instruction
            date: "2026-08-14"
            refs: [d-4c11]
      - id: DOCS-24
        text: 鍵、トークン、顧客の情報を、コード、コミット、台帳、会話のどこにも書かない。見つけたらすぐ lead に知らせ、見つけた場所と時刻を残す。見つけたものを消すだけで済ませず、どこまで広がったか（ログ、写し、ほかの人の手元）を調べて書く。
        why: 試しに貼ったトークンがコミットに残り、鍵を作り直した。
        send_why: false
        origin:
          - kind: incident
            date: "2026-08-27"
            refs: [d-0f31]
      - id: DOCS-25
        text: 外に向けて何かを送る操作（メール、通知、公開、課金）は、作り物の宛先でしか試さない。本物の宛先に送る前に、承認を台帳で取る。作り物の宛先は、チームで決めた 1 つの一覧から選び、その場で作らない。
        why: 試しに送った通知が本物の利用者 300 人に届いた。
        origin:
          - kind: incident
            date: "2026-09-15"
            refs: [d-3a09]
      - id: DOCS-26
        text: 消す操作（ファイル、ブランチ、データ）は、消す前に何が消えるかを一覧にして台帳に書く。一覧を作れないものは消さない。消したあとで、一覧にあったものがすべて消えたこと、一覧に無いものが消えていないことを確かめる。
        why: 片付けのつもりで消したブランチに、まだ取り込んでいない変更が残っていた。
        origin:
          - kind: incident
            date: "2026-09-11"
            refs: [d-3b40]
      - id: DOCS-27
        text: 権限の要る操作が必要になったら、自分で権限を足さずに頼む。頼むときは、何のために、どの範囲で、いつまで要るかを書く。足してもらった権限は、要らなくなったら外してもらい、外したことを台帳に書く。
  - heading: 品質
    rules:
      - id: DOCS-28
        text: 変更は 1 つの要求の範囲に閉じる。ついでに見つけた直したい所は、直さずに台帳へ need として書く。need には、見つけた場所と、直さないと何が困るかを 1 行ずつ書く。
        why: ついでの直しが混じった差分で、どの変更が不具合を出したのか切り分けられなかった。
        origin:
          - kind: instruction
            date: "2026-08-14"
            refs: [d-4c11]
      - id: DOCS-29
        text: テストは受け入れ条件の文 1 つにつき 1 つ以上書き、テストの名前に受け入れ条件の番号を入れる。条件に結び付かないテストは、なぜ要るかをテストの頭に書く。テストが落ちたときに読む人が、どの条件が満たされていないかを、テストの名前だけで分かるようにする。
      - id: DOCS-30
        text: CI が落ちたまま次の仕事に移らない。落ちた理由が自分の変更でなければ、その旨を台帳に書いて lead に知らせる。落ちた CI を直すのが自分でないときも、誰が直すかが決まるまで台帳の記録を開いたままにする。
        why: 落ちたままの CI に次の変更が重なり、どれが落とした原因か分からなくなった。
        origin:
          - kind: instruction
            date: "2026-10-01"
            refs: [d-6a14]
      - id: DOCS-31
        text: 試験には本物の規模の作り物を使う。数件の作り物だけで通ったと言わず、作り物の件数と作り方を実装記録に書く。作り物は、本物の件数の分布（多い日、少ない日、空の日）をまねて作る。
        why: 小さな作り物で決めた上限が、本物の規模で開いた瞬間に足りなくなった。
        origin:
          - kind: incident
            date: "2026-10-01"
            refs: [d-6b7c]
      - id: DOCS-32
        text: 落ちるテストを消したり飛ばしたりして通さない。飛ばすしかないときは、飛ばす理由と戻す条件を台帳に書き、承認を取る。戻す条件が満たされたら、飛ばしたテストを戻す要求を台帳に立てる。
        why: 飛ばしたテストが 3 か月戻されず、その間に同じ不具合が 2 回入った。
      - id: DOCS-33
        text: エラーの文は、読んだ人が次に何をすればよいか分かる文にする。何が起きたか、どこで、どう直すかの 3 つを入れる。エラーの文に、中の名前（関数、変数、内部のコード）だけを出さない。
        origin:
          - kind: instruction
            date: "2026-09-03"
            refs: [d-2b10]
      - id: DOCS-34
        text: 性能に関わる変更は、変える前と後の数字を同じ作り物で測って並べる。測っていない改善を「速くなった」と書かない。測った条件（作り物の件数、機械、回数）を数字と一緒に書き、もう一度測れるようにする。
        why: 「速くなった」と書いた変更が、本物の規模では遅くなっていた。
  - heading: 書くもの
    rules:
      - id: DOCS-35
        text: 用語は用語集に合わせる。用語集に無い言葉を使うときは、先に用語集へ足す案を出し、決まってから使う。用語集に足す案には、その語を使う文の例を 1 つ添える。
        origin:
          - kind: instruction
            date: "2026-09-03"
            refs: [d-2b10]
      - id: DOCS-36
        text: 台帳と実装記録は、そのチームにいない人が読んでも分かる文で書く。主語と目的語を省かず、指示語が何を指すかを同じ文の中で分かるようにする。略語は、そのチームの外の人が読む記録では、最初の 1 回だけ言い換えを添える。
        why: 略語だらけの実装記録を、半年後に読んだ人が誰も読めなかった。
      - id: DOCS-37
        text: コミットの題は、変えたことではなく、変えた結果できるようになったことを書く。題だけで、取り込むかどうかを判断できるようにする。題が 1 行に収まらないときは、変更が大きすぎないかを先に疑う。
      - id: DOCS-38
        text: 利用者が読む文（画面、エラー、文書）を変えたら、変える前と後の文を差分の説明に並べる。言い回しだけの変更でも省かない。並べるのが難しいときは、画面の写しを前と後で 1 枚ずつ添える。
  - heading: 終わり
    rules:
      - id: DOCS-39
        text: 仕事の終わりは、コミットと実装記録の 2 つがそろったとき。どちらか一方だけで「できた」と言わない。「できた」と言う前に、もう一度、受け入れ条件の文を 1 つずつ読み返す。
        why: コミットだけで「できた」とされ、何を確かめたのか誰も分からなかった。
        origin:
          - kind: incident
            date: "2026-09-24"
            refs: [d-5e10]
      - id: DOCS-40
        text: 実装記録には、変えたこと・確かめたこと・残したことを分けて書く。確かめていないことは、確かめていないと分かる言葉で書く。残したことには、残した理由と、誰がいつ拾うかを書く。
        origin:
          - kind: derived
            refs: [DOCS-39]
      - id: DOCS-41
        text: 「できた」と報告するときは、確かめに使ったコマンドと、その出力の最後の数行を添える。出力の無い確かめは、何を見たかを書く。出力が長いときは、全部を貼らずに、判断に要る行だけを抜き出し、抜き出したことを書く。
        why: 「確かめた」とだけ書かれた報告で、何を確かめたのかを聞き返す往復が続いた。
      - id: DOCS-42
        text: 終わった要求で見つけた次の仕事は、要求を閉じる前に need として台帳に書く。書かずに閉じたものは、無かったものとして扱う。need に書くときは、見つけた要求の ID を添え、どこから来た仕事かを辿れるようにする。
        why: 閉じた要求のあとに見つかっていた仕事が、誰の記録にも残っておらず忘れられた。
      - id: DOCS-43
        text: 取り込みのあとで不具合が見つかったら、直す前に何が起きたかを台帳に書く。原因が分かるまで、同じ所に別の変更を重ねない。不具合を直したら、同じ不具合を見つけられるテストを 1 つ足す。
        why: 原因の分からないまま直しを重ね、どの変更が壊したのか分からなくなった。
        origin:
          - kind: incident
            date: "2026-10-03"
            refs: [d-6c22]
      - id: DOCS-44
        text: 1 つの要求に 3 日以上かかったら、止まっている理由と、要求を分けられる所を lead に返す。分けられないときは、そう書く。分けた要求には、元の要求の ID を添え、元の要求の受け入れ条件をどちらが持つかを書く。
