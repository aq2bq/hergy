version: 1
description: "決済の仕組みを新しい基盤へ移す"
members:
  - name: lead
    role: lead
    profile: sonnet-fast
  - name: impl
    role: builder
    profile: codex-high
  - name: tester
    role: reviewer
    profile: codex-mini
workers:
  - from: impl
    purpose: 手順書の下書き
    profile: codex-high
  - from: tester
    purpose: 突き合わせ
    profile: haiku-chore
  - from: lead
    purpose: 事業者の資料
    profile: gemini-pro
turns:
  - human -> lead
  - lead -> human
  - lead -> impl
  - impl -> lead
  - lead -> tester
  - tester -> lead
  - impl -> tester
  - tester -> impl
  - tester -> human
  - human -> tester
