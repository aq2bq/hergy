version: 1
title: 全チームの約束
revision: 3
sections:
  - heading: 台帳
    rules:
      - id: ALL-1
        text: どのチームも、仕事の始まりと終わりを台帳に書く。会話の中だけで始めた仕事と、台帳に終わりの書かれていない仕事は、無かったものとして扱う。
        why: 2 つのチームが同じ要求を別々に進め、片方の作業がまるごと無駄になった。
        origin:
          - kind: incident
            date: "2026-08-05"
            refs: [d-0a11]
      - id: ALL-2
        text: 台帳に書く文は、そのチームにいない人が読んでも分かる文にする。チームの中だけで通じる呼び名は、最初の 1 回だけ言い換えを添える。
      - id: ALL-3
        text: 人間に決めてほしいことは、台帳の問いとして 1 つずつ立てる。1 つの問いに 2 つの決めごとを入れない。
        origin:
          - kind: instruction
            date: "2026-08-05"
            refs: [d-0a12]
  - heading: 安全
    rules:
      - id: ALL-4
        text: 鍵、トークン、顧客の情報は、コード、コミット、台帳、会話のどこにも書かない。見つけたら、どのチームのものでも、すぐ進行管理に知らせる。
        why: 試しに貼ったトークンがコミットに残り、鍵を作り直した。
        send_why: false
        origin:
          - kind: incident
            date: "2026-08-27"
            refs: [d-0f31]
      - id: ALL-5
        text: 本番の環境には誰も直接つながない。本番で起きたことを調べるときは、写しの環境で調べ、使った問い合わせを台帳に残す。
      - id: ALL-6
        text: 外に向けて何かを送る操作（メール、通知、公開、課金）は、作り物の宛先でしか試さない。本物の宛先に送るのは、人間が台帳で承認してから。
        origin:
          - kind: instruction
            date: "2026-09-15"
            refs: [d-3a09]
  - heading: 作業の場所
    rules:
      - id: ALL-7
        text: 作業は要求ごとのワークツリーで行い、main には進行管理だけが取り込む。ほかのチームのワークツリーには触らない。
      - id: ALL-8
        text: 手で動かす確かめは、作業用のディレクトリで設定の置き場所を差し替えてから行う。人の設定ファイルとホームディレクトリの中身を読みに行かない。
        why: 確かめのために動かしたコマンドが、人の設定ファイルを書き換えた。
        origin:
          - kind: incident
            date: "2026-09-02"
            refs: [d-2f18]
      - id: ALL-9
        text: 同じファイルをほかのチームが直しているときは、触る前に台帳で順番を問う。答えが出るまでは、そのファイルを直さない。
  - heading: 終わり
    rules:
      - id: ALL-10
        text: 「できた」と言うのは、コミットと実装記録がそろい、CI が通ってから。どれか 1 つでも欠けていたら、何が欠けているかを書いて返す。
      - id: ALL-11
        text: 終わった仕事で見つけた次の仕事は、閉じる前に台帳へ書く。書かずに閉じたものは、誰も拾わない。
      - id: ALL-12
        text: 1 つの仕事に 3 日以上かかったら、止まっている理由と、分けられる所を進行管理に返す。分けられないときは、そう書く。
