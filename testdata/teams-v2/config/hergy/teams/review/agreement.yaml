version: 1
title: review チームの約束
revision: 2
sections:
  - heading: 読み方
    rules:
      - id: RVW-1
        text: 差分は、要求か問いの記録と並べて読む。何のための差分か分からないときは、読む前に人間へ尋ねる。
        note: '由来: instruction 2026-09-11 d-31c0'
      - id: RVW-2
        text: 指摘は、直す人がその 1 件だけを読んで直せる文にする。ファイルと行、いまの形、直したあとの形をそろえる。 「全体的に読みにくい」とだけ返し、直す側が何をすればよいか分からず差分が 3 往復した。
        note: '由来: incident 2026-09-12 d-31c4'
      - id: RVW-3
        text: 指摘は、止めるものと、直したほうがよいものに分けて並べる。止めるものが無ければ、そう書く。
      - id: RVW-4
        text: 差分を自分で直さない。直したほうが早いと思っても、指摘として返す。
  - heading: 返し方
    rules:
      - id: RVW-5
        text: 読んだ差分の識別子（コミットか版）を、返す文の最初の行に書く。
      - id: RVW-6
        text: 返したあとで差分が更新されたら、変わった所だけを読み直し、前の指摘がどう扱われたかを 1 行ずつ書く。
        note: '由来: derived  RVW-2'
