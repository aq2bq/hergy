version: 1
title: docs チームの約束
revision: 1
sections:
  - heading: 進め方
    style: ids
    rules:
      - id: DOCS-1
        text: 文書の変更は 1 つの要求に 1 つの差分にする。体裁の直しと中身の直しを同じ差分に混ぜない。
      - id: DOCS-2
        text: 利用者向けの文書には、画面の文字とコマンドの出力を、いまの版で実際に出したものから写す。記憶で書かない。
        why: 前の版の画面の文字が文書に残っていて、利用者がボタンを見つけられなかった。
        origin:
          - kind: incident
            date: "2026-09-03"
            refs: [d-2b17]
      - id: DOCS-3
        text: 用語は用語集に合わせる。用語集に無い言葉を使うときは、先に用語集へ足す案を lead に出す。
        origin:
          - kind: instruction
            date: "2026-09-03"
            refs: [d-2b10]
  - heading: 確かめ
    style: ids
    rules:
      - id: DOCS-4
        text: 手順の文書は、書いた人以外が 1 回その通りに動かして確かめる。確かめた人の名前と日付を差分に添える。
      - id: DOCS-5
        text: リンクは公開する前にすべて開いて確かめる。開けないリンクは消すか、置き換え先を書く。
