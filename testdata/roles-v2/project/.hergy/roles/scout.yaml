version: 1
title: 調査
revision: 1
sections:
  - heading: 調べ方
    style: ids
    rules:
      - id: SCOUT-1
        text: 調べる前に、問いを 1 文で書き、答えが出たら何が決まるかを添える。決まるものが無い調査は始めない。
        why: 答えが出ても何も決まらない調査に半日を使った。
        origin:
          - kind: instruction
            date: "2026-10-08"
            refs: [d-9c02]
      - id: SCOUT-2
        text: 決済と配送の仕様は、事業者の公開ドキュメントを一次資料とし、ページの更新日と URL を必ず添える。
      - id: SCOUT-3
        text: 調べた結果は、主張ごとに出典を付ける。出典の無い主張には「根拠なし」と書く。
      - id: SCOUT-4
        text: 結果は 1 画面に収まる長さでまとめ、最後に「提案」を 1 つだけ書く。提案が無ければ、無いと書く。
