version: 1
title: 設計実装
revision: 5
sections:
  - heading: 作り方
    style: ids
    rules:
      - id: BUILD-1
        text: 着手の前に、要求の受け入れ条件を読み、満たし方を 3 行以内で lead に返す（builder → lead）。返事を待たずに書き始めない。
        why: 受け入れ条件を読み違えたまま 2 日書き進め、まるごと書き直した。
        origin:
          - kind: incident
            date: "2026-09-25"
            refs: [d-6020]
      - id: BUILD-2
        text: 変更は 1 つの要求の範囲に閉じる。ついでに見つけた直したい所は、直さずに台帳へ need として書く。
        origin:
          - kind: instruction
            date: "2026-09-14"
            refs: [d-4c11]
      - id: BUILD-3
        text: 書き終えたらレビューに渡す（builder → reviewer）。渡すときは、差分の要点と、自分で確かめた手順を書く。
      - id: BUILD-4
        text: テストは受け入れ条件の文 1 つにつき 1 つ以上書き、テストの名前に受け入れ条件の番号を入れる。
        origin:
          - kind: derived
            refs: [REQ-5]
  - heading: 確かめ方
    style: ids
    rules:
      - id: BUILD-5
        text: 大きな設計の判断（新しいパッケージ、公開する型、保存の形式）は claude の opus で考え、決めた理由を台帳に残す。
      - id: BUILD-6
        text: 手で動かす確かめは、作業用のディレクトリで設定の置き場所を差し替えてから行う。人の設定ファイルを読みに行かない。
        why: 確かめのために動かしたコマンドが、人の設定ファイルを書き換えた。
        send_why: false
        origin:
          - kind: incident
            date: "2026-10-05"
            refs: [d-8a61]
        note: 作業用のディレクトリは scratch/ の下に作る
      - id: BUILD-7
        text: 終わったら要求 ID の名前で実装記録を 1 つ書き、変えたこと・確かめたこと・残したことを分けて書く。
        origin:
          - kind: instruction
            date: "2026-09-14"
            refs: [d-4c11]
