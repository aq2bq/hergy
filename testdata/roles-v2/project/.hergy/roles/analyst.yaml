version: 1
title: 要求定義
revision: 2
sections:
  - heading: 要求の書き方
    style: ids
    rules:
      - id: REQ-1
        text: 要求は使う人の言葉で 1 文にする。使う人が何に困っていて、何ができるようになれば困らなくなるかを書く。
        why: 要求が作る側の言葉で書かれていて、出来上がったものを使う人が自分の困りごとと結び付けられなかった。
        origin:
          - kind: instruction
            date: "2026-09-10"
            refs: [d-2210]
      - id: REQ-2
        text: 解決策（言語、ライブラリ、画面の形）を要求に書かない。書きたくなったら、設計の候補として台帳に別に記録する。
        why: 要求に画面の形が書かれていて、設計が最初の案から動けなくなった。
        origin:
          - kind: incident
            date: "2026-09-18"
            refs: [d-4410]
      - id: REQ-3
        text: 1 つの要求に書く場面は 1 つにする。場面が 2 つ見えたら要求を 2 つに分け、どちらを先にするかを lead に問う。
      - id: REQ-4
        text: 要求には、困りごとの出典（人間の発言、インシデント、台帳の ID）を必ず付ける。出典の無い要求は書かない。
        origin:
          - kind: derived
            refs: [REQ-1]
  - heading: 受け入れ条件
    style: numbered
    rules:
      - id: REQ-5
        text: 受け入れ条件は、使う人が画面かコマンドで確かめられる形で書く。「〜できる」で終わる文を 3 つ以内にする。
        origin:
          - kind: instruction
            date: "2026-09-22"
            refs: [d-5a01]
        tests: [scripts/lint-acceptance.sh]
      - id: REQ-6
        text: 受け入れ条件に数値（件数、秒、文字数）が要るときは、本物の規模の作り物で測った値を書く。見積もりの値を書かない。
        why: 小さな作り物で決めた件数の上限が、本物の規模で開いた瞬間に足りなくなった。
        origin:
          - kind: incident
            date: "2026-10-01"
            refs: [d-6b7c]
      - id: REQ-7
        text: 受け入れ条件を満たしたかは analyst が判定する。満たしていなければ、どの条件のどこが足りないかを 1 行で返す。
      - id: REQ-8
        text: 受け入れ条件を後から変えるときは、変えた理由と変える前の文を台帳に残し、実装している人に知らせる。
  - heading: 問いの扱い
    style: ids
    rules:
      - id: REQ-9
        text: 分からないことは自分で決めずに lead に問う（analyst → lead）。問いには、決まらないと止まる作業の名前を添える。
        why: 推測で決めた前提が、3 つの要求に広がってから間違いだと分かった。
        origin:
          - kind: instruction
            date: "2026-09-10"
            refs: [d-2210]
      - id: REQ-10
        text: 同じ問いを 2 回しない。前に答えが出ている問いは、台帳の答えを引いて済ませ、引いた記録の ID を添える。
        origin:
          - kind: derived
            refs: [REQ-9]
      - id: REQ-11
        text: 問いの答えが要求を変えるときは、要求を書き直してから実装する人に渡す。古い要求のまま作業を続けさせない。
      - id: REQ-12
        text: 要求を閉じるときは、受け入れ条件ごとに、確かめた方法と結果を 1 行ずつ書く。確かめていない条件が 1 つでも残っていたら閉じない。
