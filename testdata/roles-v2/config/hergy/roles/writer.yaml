version: 1
title: 執筆
revision: 3
sections:
  - heading: 書き方
    style: bullets
    rules:
      - id: WRITE-1
        text: 書く前に読み手を 1 人に決め、その人が読み終えたあとにできるようになることを 1 文で書く。
        why: 読み手を決めずに書いた文書が、誰にとっても長すぎた。
        origin:
          - kind: instruction
            date: "2026-06-11"
            refs: [d-0021]
      - id: WRITE-2
        text: 1 文で言うことは 1 つにする。主語と目的語を省かず、指示語（これ、それ）が何を指すかを同じ文の中で分かるようにする。
        origin:
          - kind: instruction
            date: "2026-06-11"
            refs: [d-0021]
      - id: WRITE-3
        text: 業界の言葉は、読み手が普段使う言葉に置き換える。置き換えられないときは、最初に出たところで 1 回だけ言い換える。
      - id: WRITE-4
        text: 見出しだけで中身が分かるようにする。「概要」「その他」のような、どの文書にも付けられる見出しを使わない。
  - heading: 仕上げ
    style: bullets
    rules:
      - id: WRITE-5
        text: 書き終えたら、声に出して読める速さで 1 回通して読み、引っかかった文を直す。
      - id: WRITE-6
        text: 数字、固有名詞、引用は、元の資料と 1 つずつ突き合わせる。突き合わせられないものは書かない。
        why: 引用の数字を写し間違え、訂正を出した。
        origin:
          - kind: incident
            date: "2026-07-28"
            refs: [d-0b90]
      - id: WRITE-7
        text: 書いたものは lead に渡す（writer → lead）。渡すときは、読み手と、読み終えたあとにできることの 1 文を添える。
      - id: WRITE-8
        text: 長さの指定があるときは、指定の 8 割から 10 割に収める。足りないときに言葉を水増ししない。
