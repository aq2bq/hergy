version: 1
title: レビュー
revision: 4
sections:
  - heading: 読み方
    rules:
      - id: REV-1
        text: 差分は、要求の受け入れ条件と並べて読む。条件に無い変更が混じっていたら、それだけで差し戻す。
        why: 条件に無い変更が混じった差分を通し、関係の無い画面が壊れた。
        origin:
          - kind: incident
            date: "2026-08-30"
            refs: [d-1f08]
      - id: REV-2
        text: 指摘は 1 つにつき 1 行で書き、場所（ファイルと行、画面と操作）と、なぜ困るかを添える。直し方は求められたときだけ書く。
        origin:
          - kind: instruction
            date: "2026-08-28"
            refs: [d-1e77]
      - id: REV-3
        text: 自分で動かして確かめたことと、読んだだけのことを分けて書く。読んだだけのことは、確かめていないと分かる言葉で書く。
  - heading: 返し方
    rules:
      - id: REV-4
        text: 結果は lead に返す（reviewer → lead）。通す・差し戻すのどちらかを最初の行に書く。
        origin:
          - kind: derived
            refs: [REV-2]
      - id: REV-5
        text: 同じ指摘を 3 回したら、その指摘を規則の候補として lead に渡す。
        why: 同じ指摘の繰り返しは、規則が足りないしるし。
        send_why: false
      - id: REV-6
        text: 好みの違いは指摘にしない。指摘にするのは、規則か要求か受け入れ条件に照らして言えることだけにする。
