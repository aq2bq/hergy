version: 1
title: 調査
revision: 2
sections:
  - heading: 調べ方
    rules:
      - id: SCOUT-1
        text: 調べる前に、問いを 1 文で書く。答えが出たら何が決まるかも書き、決まるものが無い調査は始めない。
        note: '由来: instruction 2026-07-04 d-0a19'
      - id: SCOUT-2
        text: 主張ごとに出典を付ける。出典の無い主張には「根拠なし」と書き、推測と事実を同じ段落に混ぜない。 推測が事実と同じ段落に書かれていて、読んだ人が推測を事実として引用した。
        note: '由来: incident 2026-07-20 d-0b55'
      - id: SCOUT-3
        text: 一次資料（公式の文書、原典、統計の元データ）を先に当たり、まとめ記事は手がかりとしてだけ使う。
  - heading: まとめ方
    rules:
      - id: SCOUT-4
        text: 結果は 1 画面に収まる長さでまとめ、反対の立場の根拠も 1 つは書く。
      - id: SCOUT-5
        text: 数字には単位と時点を付ける。為替、価格、利回りのように動く値は、取った日付を必ず添える。
        note: '由来: instruction 2026-08-02 d-0c80'
