            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: 保存できない下書きか、使えないロール名
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: 書き込みを受け取れない（Origin がこの画面のものでない、または X-Hergy-Token がこの起動のものでない）
