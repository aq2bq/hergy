  /api/team/check:
    post:
      operationId: checkTeam
      summary: チーム定義の下書きを検査する
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        default:
          description: まだ書いていない（pending）
          content:
            application/json:
              schema: {}
  /api/role:
    get:
      operationId: listRoles
      summary: ロールの一覧
      description: ロール名ごとの行。行は置き場所ごとのロールの文書と、一覧が読む数を持つ。
      parameters:
        - name: project
          in: query
          required: false
