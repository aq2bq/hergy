      responses:
        "200":
          description: 削除後のプロジェクト一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQProjects'
        "403":
          description: 書き込みを許可できない
          content:
            text/plain:
              schema:
                type: string
                description: 断った理由
        "404":
          description: 並びから外すプロジェクトがない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "422":
          description: プロジェクトを並びから外せない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/teams:
    get:
      operationId: listHQTeams
