# WebUI の API の約束（n-e3de、d-e206）。これが正で、Go の答えと TS の型がここに縛られる。
# 書き方は internal/apicontract/doc.go。まだ形を書いていない操作は pending.txt にある。
openapi: 3.0.3
info:
  title: hergy WebUI API
  version: "1"
  description: hergy serve が 127.0.0.1 で答える、WebUI のための API。書き込みは X-Hergy-Token が要る。
