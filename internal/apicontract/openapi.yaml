# WebUI の API の約束（n-e3de、d-e206）。これが正で、Go の答えと TS の型がここに縛られる。
# 書き方は internal/apicontract/doc.go。API の道を足すときは、同じ変更でここに形を書く。
openapi: 3.0.3
info:
  title: hergy WebUI API
  version: "1"
  description: hergy serve が 127.0.0.1 で答える、WebUI のための API。書き込みは X-Hergy-Token が要る。
paths:
  /api/team:
    get:
      operationId: listTeams
      summary: チーム定義の一覧
      description: チーム定義ごとに、プロジェクトとグローバルの読み取り、集計、YAML タブのファイルを返す。
      parameters:
        - name: project
          in: query
          required: false
          description: 並べたプロジェクトのパス。省略するとこの serve のプロジェクトを読む。
          schema:
            type: string
      responses:
        "200":
          description: チーム定義の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
        default:
          description: 読み取りを断ったときの答え
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
            text/plain:
              schema:
                type: string
                description: 書き込み用トークンなどを断った理由
  /api/team/{name}:
    get:
      operationId: getTeam
      summary: チーム定義を 1 件読む
      description: 指定した場所のチーム定義とチームのルールを返す。
      parameters:
        - name: name
          in: path
          required: true
          description: チーム定義名
          schema:
            type: string
        - name: place
          in: query
          required: true
          description: 読む場所。project または global。
          schema:
            type: string
            enum: [project, global]
        - name: project
          in: query
          required: false
          description: 並べたプロジェクトのパス。省略するとこの serve のプロジェクトを読む。
          schema:
            type: string
      responses:
        "200":
          description: 1 つの場所にあるチーム定義
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDefinitionRead'
        default:
          description: 読み取りを断ったときの答え
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
            text/plain:
              schema:
                type: string
                description: 書き込み用トークンなどを断った理由
    put:
      operationId: saveTeam
      summary: チーム定義を保存する
      description: チーム定義、チームのルール、または YAML の全文を保存する。
      parameters:
        - name: name
          in: path
          required: true
          description: チーム定義名
          schema:
            type: string
        - name: X-Hergy-Token
          in: header
          required: true
          description: この serve の書き込み用トークン
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: 指定するときはこの serve と同じ origin
          schema:
            type: string
      requestBody:
        required: true
        description: 保存するチーム定義またはチームのルール
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamSaveRequest'
      responses:
        "200":
          description: 保存後のチーム定義と一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSaved'
        default:
          description: 保存を断ったときの答え
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
            text/plain:
              schema:
                type: string
                description: 書き込み用トークンなどを断った理由
    delete:
      operationId: deleteTeam
      summary: チーム定義を消す
      description: 指定した場所のチーム定義とチームのルールを消し、残った一覧を返す。
      parameters:
        - name: name
          in: path
          required: true
          description: チーム定義名
          schema:
            type: string
        - name: X-Hergy-Token
          in: header
          required: true
          description: この serve の書き込み用トークン
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: 指定するときはこの serve と同じ origin
          schema:
            type: string
        - name: place
          in: query
          required: true
          description: 消す場所。project または global。
          schema:
            type: string
            enum: [project, global]
        - name: hash
          in: query
          required: false
          description: 読み取った team.yaml のハッシュ
          schema:
            type: string
        - name: agreement_hash
          in: query
          required: false
          description: 読み取った agreement.yaml のハッシュ
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: 並べたプロジェクトのパス。省略するとこの serve のプロジェクトを読む。
          schema:
            type: string
      responses:
        "200":
          description: 削除後のチーム定義の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
        default:
          description: 削除を断ったときの答え
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
            text/plain:
              schema:
                type: string
                description: 書き込み用トークンなどを断った理由
  /api/team/check:
    post:
      operationId: checkTeam
      summary: チーム定義の下書きを検査する
      description: チーム定義、チームのルール、YAML 全文、またはワーカーの初期プロンプトを検査する。
      parameters:
        - name: X-Hergy-Token
          in: header
          required: true
          description: この serve の書き込み用トークン
          schema:
            type: string
        - name: Origin
          in: header
          required: false
          description: 指定するときはこの serve と同じ origin
          schema:
            type: string
      requestBody:
        required: true
        description: 検査するチーム定義またはチームのルール
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCheckRequest'
      responses:
        "200":
          description: 検査結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCheckResponse'
        default:
          description: 検査を断ったときの答え
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
            text/plain:
              schema:
                type: string
                description: 書き込み用トークンなどを断った理由
  /api/role:
    get:
      operationId: listRoles
      summary: ロールの一覧
      description: ロール名ごとの行。行は置き場所ごとのロールの文書と、一覧が読む数を持つ。
      parameters:
        - name: project
          in: query
          required: false
          description: 読むプロジェクト（本部に並べたプロジェクトの名前）。省くと serve を起動したプロジェクトを読む。
          schema:
            type: string
      responses:
        "200":
          description: ロール名ごとの行と、ロールの文書が入っているファイルのハッシュ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
  /api/role/{name}:
    get:
      operationId: getRole
      summary: ロールを 1 件読む
      parameters:
        - name: name
          in: path
          required: true
          description: ロール名
          schema:
            type: string
        - name: place
          in: query
          required: false
          description: 読む置き場所。project はプロジェクト、global はグローバル。
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: 読むプロジェクト（本部に並べたプロジェクトの名前）。省くと serve を起動したプロジェクトを読む。
          schema:
            type: string
      responses:
        "200":
          description: ロールの文書 1 つと、その文書が入っているファイルの文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGet"
        "404":
          description: その置き場所にロールの文書がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
    put:
      operationId: saveRole
      summary: ロールを保存する
      parameters:
        - name: name
          in: path
          required: true
          description: 行のロール名。書く文書の名前は本文の doc.name が決める。
          schema:
            type: string
      requestBody:
        required: true
        description: 欄の下書き（doc）か、YAML タブが打っている文（text）のどちらか
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleSaveRequest"
      responses:
        "200":
          description: 保存したロールの文書と、保存のあとの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleSaved"
        "409":
          description: 読んだときからファイルが変わっていた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: 保存できない下書きか、使えないロール名
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: 書き込みを受け取れない（Origin がこの画面のものでない、または X-Hergy-Token がこの起動のものでない）
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteRole
      summary: ロールを消す
      parameters:
        - name: name
          in: path
          required: true
          description: 消すロール名
          schema:
            type: string
        - name: place
          in: query
          required: false
          description: 消す置き場所。project はプロジェクト、global はグローバル。
          schema:
            type: string
        - name: hash
          in: query
          required: false
          description: 読んだときのファイルのハッシュ。今のハッシュと違えば消さない。
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: 消すプロジェクト（本部に並べたプロジェクトの名前）。省くと serve を起動したプロジェクト。
          schema:
            type: string
      responses:
        "200":
          description: 消したあとのロールの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "409":
          description: 読んだときからファイルが変わっていた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: 書き込みを受け取れない（Origin がこの画面のものでない、または X-Hergy-Token がこの起動のものでない）
          content:
            text/plain:
              schema:
                type: string
  /api/role/check:
    post:
      operationId: checkRole
      summary: ロールの下書きを検査する
      requestBody:
        required: true
        description: 欄の下書き（doc）か、YAML タブが打っている文（text）のどちらか
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCheckRequest"
      responses:
        "200":
          description: 見つかった問題、メンバーが読む Markdown、変更が動かした行、その文書を読むメンバー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCheck"
        "422":
          description: 下書きが読めない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: 書き込みを受け取れない（Origin がこの画面のものでない、または X-Hergy-Token がこの起動のものでない）
          content:
            text/plain:
              schema:
                type: string
  /api/profile:
    get:
      operationId: listProfiles
      summary: プロファイルの一覧
      description: プロファイル名ごとの行と、2 つのプロファイルのファイル（YAML タブが読む文とハッシュ）。
      parameters:
        - name: project
          in: query
          required: false
          description: 読むプロジェクト（本部に並べたプロジェクトの名前）。省くと serve を起動したプロジェクトを読む。
          schema:
            type: string
      responses:
        "200":
          description: プロファイル名ごとの行、2 つのファイルのハッシュ、2 つのファイルの読み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
  /api/profile/{name}:
    get:
      operationId: getProfile
      summary: プロファイルを 1 件読む
      parameters:
        - name: name
          in: path
          required: true
          description: プロファイル名
          schema:
            type: string
        - name: place
          in: query
          required: false
          description: 読む置き場所。project はプロジェクト、global はグローバル。
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: 読むプロジェクト（本部に並べたプロジェクトの名前）。省くと serve を起動したプロジェクトを読む。
          schema:
            type: string
      responses:
        "200":
          description: その置き場所のプロファイル 1 つと、そのファイルの文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileGet"
        "404":
          description: その置き場所にそのプロファイルがない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
    put:
      operationId: saveProfile
      summary: プロファイルを保存する
      parameters:
        - name: name
          in: path
          required: true
          description: 行のプロファイル名。書くプロファイルの名前は本文の doc.name が決める。
          schema:
            type: string
      requestBody:
        required: true
        description: 欄の下書き（doc）か、YAML タブが打っている文（text）のどちらか
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSaveRequest"
      responses:
        "200":
          description: 保存したプロファイルと、保存のあとの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSaved"
        "400":
          description: 置き場所が project でも global でもない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: 読んだときからファイルが変わっていた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: 保存できない下書きか、ファイルを置く場所がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: 書き込みを受け取れない（Origin がこの画面のものでない、または X-Hergy-Token がこの起動のものでない）
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteProfile
      summary: プロファイルを消す
      parameters:
        - name: name
          in: path
          required: true
          description: 消すプロファイル名
          schema:
            type: string
        - name: place
          in: query
          required: false
          description: 消す置き場所。project はプロジェクト、global はグローバル。
          schema:
            type: string
        - name: hash
          in: query
          required: false
          description: 読んだときのファイルのハッシュ。今のハッシュと違えば消さない。
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: 消すプロジェクト（本部に並べたプロジェクトの名前）。省くと serve を起動したプロジェクト。
          schema:
            type: string
      responses:
        "200":
          description: 消したあとのプロファイルの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "400":
          description: 置き場所が project でも global でもない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: 読んだときからファイルが変わっていた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: その置き場所にそのプロファイルがない、またはファイルを置く場所がない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: 書き込みを受け取れない（Origin がこの画面のものでない、または X-Hergy-Token がこの起動のものでない）
          content:
            text/plain:
              schema:
                type: string
  /api/profile/check:
    post:
      operationId: checkProfile
      summary: プロファイルの下書きを検査する
      requestBody:
        required: true
        description: 欄の下書き（doc）か、YAML タブが打っている文（text）のどちらか
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCheckRequest"
      responses:
        "200":
          description: 見つかった問題
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCheck"
        "400":
          description: 置き場所が project でも global でもない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: 下書きが読めない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: 書き込みを受け取れない（Origin がこの画面のものでない、または X-Hergy-Token がこの起動のものでない）
          content:
            text/plain:
              schema:
                type: string
  /api/activity:
    get:
      operationId: listActivity
      summary: 動いているチームの一覧
      responses:
        "200":
          description: 活動の一覧と数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
  /api/activity/{name}:
    get:
      operationId: getActivity
      summary: 動いているチームを 1 つ開く
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 開いたチームの活動
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityOpened'
        "404":
          description: 動いているチームが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
    put:
      operationId: saveActivity
      summary: 活動は読むだけなので断る
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "405":
          description: 活動は読むだけ
          content:
            text/plain:
              schema:
                type: string
                description: 読み取り専用のため断った理由
    delete:
      operationId: deleteActivity
      summary: 活動は読むだけなので断る
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "405":
          description: 活動は読むだけ
          content:
            text/plain:
              schema:
                type: string
                description: 読み取り専用のため断った理由
  /api/activity/check:
    post:
      operationId: checkActivity
      summary: 活動は読むだけなので断る
      responses:
        "405":
          description: 活動は読むだけ
          content:
            text/plain:
              schema:
                type: string
                description: 読み取り専用のため断った理由
  /api/apply:
    get:
      operationId: listApply
      summary: 反映していない変更の一覧
      description: 動いているチームを保存した定義と比べ、メンバーごとにずれと反映の仕方を返す。ずれのあるチームとメンバーだけを返す。
      responses:
        "200":
          description: 反映していない変更
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyList'
    post:
      operationId: applyMembers
      summary: ずれを反映する
      description: 名指したメンバーのずれを反映する。反映は答えのあとに進み、その進み具合と起動の途中の問いは GET /api/hq/launches/{id} で読む。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        "202":
          description: 反映の進み具合
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [launch]
                properties:
                  launch:
                    $ref: '#/components/schemas/HQLaunch'
        "403":
          description: 書き込みを許可できない
          content:
            text/plain:
              schema:
                type: string
                description: 断った理由
        "404":
          description: 反映の読み取りがない
          content:
            text/plain:
              schema:
                type: string
                description: 読み取りがない理由
        "409":
          description: 同じチームの反映が進んでいる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "422":
          description: 要求を読めないか、名指したメンバーに反映できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
            text/plain:
              schema:
                type: string
                description: 要求本文を読めない理由
  /api/apply/count:
    get:
      operationId: countApply
      summary: 反映していない変更の数
      description: 帯の「反映していない変更」が出す数。反映できるかどうかに関わらず、ずれのあるメンバーの数。
      responses:
        "200":
          description: 数
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [count]
                properties:
                  count:
                    type: integer
                    minimum: 0
                    description: 反映していない変更の数
  /api/hq/projects:
    get:
      operationId: listHQProjects
      summary: 並べたプロジェクト
      responses:
        "200":
          description: 本部が読むプロジェクト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQProjects'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
    post:
      operationId: addHQProject
