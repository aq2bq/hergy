          description: プロジェクトごとのロール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQRoleGroups'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/profiles:
    get:
      operationId: listHQProfiles
      summary: 並べたプロジェクトのプロファイル
      responses:
        "200":
          description: プロジェクトごとのプロファイル
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQProfileGroups'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/running:
    get:
      operationId: listHQRunning
      summary: 動いているチーム
      responses:
        "200":
          description: 動いているチームと herdr の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQRunning'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/workspaces:
    get:
      operationId: listHQWorkspaces
      summary: herdr のワークスペース
      responses:
        "200":
          description: herdr のワークスペース
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQWorkspaces'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/launch/options:
    get:
      operationId: getHQLaunchOptions
      summary: 起動の欄の選択肢
      parameters:
        - name: project
          in: query
          required: false
          schema:
            type: string
            description: 起動するチーム定義が属するプロジェクト
        - name: definition
          in: query
          required: false
          schema:
            type: string
            description: 起動するチーム定義名
        - name: place
          in: query
          required: false
          schema:
            type: string
            description: チーム定義を読む場所
      responses:
        "200":
          description: 起動の選択肢
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQLaunchOptions'
        "422":
          description: 起動の選択肢を作れない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/launch:
    post:
      operationId: startHQLaunch
      summary: チームを起動する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HQLaunchRequest'
      responses:
        "202":
          description: 起動を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQLaunchEnvelope'
        "403":
          description: 書き込みを許可できない
          content:
            text/plain:
              schema:
                type: string
                description: 断った理由
        "409":
          description: 名前が重なったか、ワークスペースが使えない（workspace_taken・workspace_busy）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Refusal'
                  - $ref: '#/components/schemas/HQLaunchNameTaken'
        "422":
          description: チームを起動できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "503":
          description: 本部または herdr を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/launches/{id}:
    get:
      operationId: getHQLaunch
      summary: 起動の進み具合
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 起動の進み具合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQLaunchEnvelope'
        "404":
          description: 起動記録が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
    delete:
      operationId: cancelHQLaunch
      summary: 起動の待ちをやめる
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 待ちをやめた起動の状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQLaunchEnvelope'
        "403":
          description: 書き込みを許可できない
          content:
            text/plain:
              schema:
                type: string
                description: 断った理由
        "404":
          description: 起動記録が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
  /api/hq/stop:
    post:
      operationId: stopHQTeam
      summary: チームを止める
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HQStopRequest'
      responses:
        "200":
          description: 止めたチームと閉じた数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQStopped'
        "403":
          description: 書き込みを許可できない
          content:
            text/plain:
              schema:
                type: string
                description: 断った理由
        "404":
          description: 動いているチームが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "503":
          description: 本部または herdr を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
components:
  schemas:
    Problem:
      description: 検査が見つけた問題 1 つ（spec-boundary 5）。どこにあり、どれだけ悪く、サーバーが作った文は何か。
      type: object
      additionalProperties: false
      required: [sev, at, text, section, rule]
      properties:
        sev:
          type: string
          enum: [err, warn]
          description: err は読めない・保存を止める問題、warn は読めるが直したほうがよい問題
        at:
          type: string
          description: 問題が立つ場所。文書の欄の道（members[0].role など）か、文のときは line
        field:
          type: string
          description: 欄そのものの名前。at と同じ値を入れる検査もある
        text:
          type: string
          description: 利用者が読む文
        line:
          type: integer
          description: 文の何行目か（1 から）
        section:
          type: integer
          description: 規則の文書の節の番号（0 から）。節を指さないときは -1
        rule:
          type: integer
          description: 節の中の規則の番号（0 から）。規則を指さないときは -1
        definition:
          type: string
          description: 問題が立つチーム定義名（並べたプロジェクトの検査など）
        role:
          type: string
          description: 組み合わせの問題が指すロール名
        rule_id:
          type: string
          description: 組み合わせの問題が指す規則の ID
    Refusal:
      description: 断ったときの答え。text は利用者が読む文。
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: 断った理由を言う文
        at:
          type: string
          description: 文が指す欄（name など）
        hash:
          type: string
          description: ファイルが変わっていたときの今のハッシュ
    Counts:
      description: 1 つの行が抱える問題の数（spec-boundary 5）。一覧の欄と、置き場所ごとの読みが答える。
      type: object
      additionalProperties: false
      required: [err, warn]
      properties:
        err:
          type: integer
          minimum: 0
          description: 保存を止める問題の数
        warn:
          type: integer
          minimum: 0
          description: 読めるが直したほうがよい問題の数
    RoleList:
      description: GET /api/role の答え（spec-boundary 5）。ロール名ごとの行と、ロールの文書が入っているファイルのハッシュ。
      type: object
      additionalProperties: false
      required: [items, hashes]
      properties:
        items:
          type: array
          nullable: true
          description: ロール名ごとの行。ロールが 1 つもなければ null。
          items:
            $ref: "#/components/schemas/RoleItem"
        hashes:
          type: object
          additionalProperties:
            type: string
          description: 置き場所とロール名（project.builder）ごとの、ロールの文書が入っているファイルのハッシュ
    RoleItem:
      description: ロールの一覧の 1 行。置き場所ごとの読みと、一覧の欄が読む数を持つ。
      type: object
      additionalProperties: false
      required: [name, places, effective, hidden, summary, problems]
      properties:
        name:
          type: string
          description: ロール名
        places:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RolePlace"
          description: 置き場所（project か global）ごとの、そのロール名の読み
        effective:
          type: string
          description: 使われる置き場所。両方に文書があれば project、グローバルのものだけなら global。
        hidden:
          type: array
          nullable: true
          description: 別の置き場所の文書に隠れている置き場所
          items:
            type: string
        summary:
          $ref: "#/components/schemas/RoleSummary"
        problems:
          $ref: "#/components/schemas/Counts"
    RolePlace:
      description: 1 つの置き場所のロールの文書と、それが入っているファイルの読み。
      type: object
      additionalProperties: false
      required: [doc, text, hash, path, problems]
      properties:
        doc:
          $ref: "#/components/schemas/RoleDoc"
        text:
          type: string
          description: ロールの文書が入っているファイルの全体の文
        hash:
          type: string
          description: ロールの文書が入っているファイルのハッシュ
        path:
          type: string
          description: ロールの文書のファイルの道
        readers:
          type: integer
          minimum: 0
          description: この名前を読む人たちの数。ロールの読みは送らない。
        savedLine:
          type: boolean
          description: いま保存した欄か（保存の答えだけが立てる）
        problems:
          $ref: "#/components/schemas/Counts"
    RoleDoc:
      description: ロールの文書 1 つ。節と規則だけを持ち、ファイルのハッシュと文は置き場所が持つ。
      type: object
      additionalProperties: false
      required: [name, title, revision, sections]
      properties:
        name:
          type: string
          description: ロール名
        title:
          type: string
          description: 文書の題
        revision:
          type: integer
          nullable: true
          description: 文書のバージョン。書いていなければ null。
        sections:
          type: array
          nullable: true
          description: 文書の節
          items:
            $ref: "#/components/schemas/RoleSection"
    RoleSection:
      description: ロールの文書の節 1 つ。見出しと前書きと、その節の規則を持つ。
      type: object
      additionalProperties: false
      required: [heading, level, intro, rules]
      properties:
        from:
          type: integer
          nullable: true
          description: 保存されている文書でこの節が立つ節の番号。下書きが送る。
        heading:
          type: string
          description: 節の見出し
        level:
          type: integer
          description: 見出しの深さ（Markdown の # の数）
        intro:
          type: string
          description: 節の前書き
        rules:
          type: array
          nullable: true
          description: この節の規則
          items:
            $ref: "#/components/schemas/RoleRule"
    RoleRule:
      description: ロールの文書の規則 1 つ。
      type: object
      additionalProperties: false
      required: [id, text, in_prompt, note]
      properties:
        from:
          type: object
          nullable: true
          additionalProperties: false
          description: 保存されている文書でこの規則が立つ場所。下書きが送る。
          required: [section, rule]
          properties:
            section:
              type: integer
              description: 節の番号
            rule:
              type: integer
              description: 節の中での規則の番号
        id:
          type: string
          description: 規則の ID
        text:
          type: string
          description: 規則の文
        in_prompt:
          type: boolean
          description: プロンプトに含めるか
        off_since:
          type: string
          description: 規則を切った日。切っていなければ空。
        note:
          type: string
          description: 規則に添えるメモ
    RoleSummary:
      description: ロールの一覧の 1 行が読む数（spec-boundary 5）。
      type: object
      additionalProperties: false
      required: [rules, chars]
      properties:
        rules:
          type: integer
          minimum: 0
          description: プロンプトに入る規則の数
        chars:
          type: integer
          minimum: 0
          description: メンバー 1 人が読む文の文字数
        markdown:
          type: string
          description: 文書がまだ Markdown のままで読めないときの文
        noDoc:
          type: boolean
          description: まだロールの文書がない行か
        isNew:
          type: boolean
          description: これからロールの文書を作る行か
    RoleGet:
      description: GET /api/role/{name} の答え。ロールの文書 1 つと、それが入っているファイルの文とハッシュ。
      type: object
      additionalProperties: false
      required: [doc, text, hash, path, effective, hidden]
      properties:
        doc:
          $ref: "#/components/schemas/RoleDoc"
        text:
          type: string
          description: ロールの文書が入っているファイルの全体の文
        hash:
          type: string
          description: ロールの文書が入っているファイルのハッシュ
        path:
          type: string
          description: ロールの文書のファイルの道
        effective:
          type: string
          description: 使われる置き場所
        hidden:
          type: array
          nullable: true
          description: 別の置き場所の文書に隠れている置き場所
          items:
            type: string
    RoleCheck:
      description: POST /api/role/check の答え（spec-boundary 5）。問題、メンバーが読む Markdown、変更が動かした行と規則の矢印、その文書を読むメンバー。
      type: object
      additionalProperties: false
      required: [problems, preview, effect, readers]
      properties:
        problems:
          type: array
          description: 見つかった問題
          items:
            $ref: "#/components/schemas/Problem"
        preview:
          $ref: "#/components/schemas/RolePreview"
        effect:
          $ref: "#/components/schemas/RoleEffect"
        readers:
          type: array
          description: そのロールの文書を読むメンバー
          items:
            $ref: "#/components/schemas/RoleReader"
        limit:
          type: integer
          minimum: 0
          description: この文書に置いている文字数の目安。0 のときは送らない。
        size:
          type: integer
          minimum: 0
          description: プロンプトに入る部分の文字数。0 のときは送らない。
    RolePreview:
      description: メンバーが読む Markdown。1 行ずつと、全体の文字数。
      type: object
      additionalProperties: false
      required: [lines, chars]
      properties:
        lines:
          type: array
          nullable: true
          description: Markdown の行
          items:
            $ref: "#/components/schemas/RolePreviewLine"
        chars:
          type: integer
          minimum: 0
          description: 全体の文字数
    RolePreviewLine:
      description: Markdown の 1 行。どの節のどの規則から来たかも持つ。
      type: object
      additionalProperties: false
      required: [text, part, section, rule]
      properties:
        text:
          type: string
          description: 行の文
        part:
          type: string
          description: 行の種類（見出し、本文、空行、切った規則など）
        section:
          type: integer
          description: 行が来た節の番号。節から来ていなければ -1。
        rule:
          type: integer
          description: 行が来た規則の番号。規則から来ていなければ -1。
    RoleEffect:
      description: 下書きが保存されている文書からどう動いたか。
      type: object
      additionalProperties: false
      required: [diff, turns]
      properties:
        diff:
          $ref: "#/components/schemas/RoleDiff"
        turns:
          type: array
          description: 規則の文が書く矢印を、その文書を読むチーム定義ごとに見たもの
          items:
            $ref: "#/components/schemas/RoleTurn"
    RoleDiff:
      description: メンバーが読む Markdown の、保存されている文書からの動き。
      type: object
      additionalProperties: false
      required: [added, removedBefore, removedAtEnd]
      properties:
        added:
          type: array
          nullable: true
          description: 増えた行の番号
          items:
            type: integer
        removedBefore:
          type: array
          nullable: true
          description: 消えた行が、その番号の行の前に立っていた
          items:
            type: integer
        removedAtEnd:
          type: boolean
          description: 消えた行が最後の行より後ろに立っていた
    RoleTurn:
      description: 規則の文が書く矢印 1 つを、その文書を読むチーム定義 1 つについて見たもの。
      type: object
      additionalProperties: false
      required: [section, rule, arrow, definition, ok]
      properties:
        section:
          type: integer
          description: 矢印を書いた規則がある節の番号
        rule:
          type: integer
          description: 矢印を書いた規則の番号
        arrow:
          type: string
          description: 矢印を人が読む形（lead -> builder）
        definition:
          type: string
          description: その矢印を見たチーム定義の名前
        ok:
          type: boolean
          description: そのチーム定義の turns がこの矢印を持つか
    RoleReader:
      description: そのロールの文書を読むメンバー 1 人。
      type: object
      additionalProperties: false
      required: [definition, member]
      properties:
        definition:
          type: string
          description: そのメンバーがいるチーム定義の名前
        member:
          type: string
          description: メンバー名
    RoleSaved:
      description: PUT /api/role/{name} の答え（spec-boundary 5）。保存したロールの文書と、保存のあとの一覧。
      type: object
      additionalProperties: false
      required: [doc, text, hash, path]
      properties:
        doc:
          $ref: "#/components/schemas/RoleDoc"
        text:
          type: string
          description: 保存したファイルの全体の文
        hash:
          type: string
          description: 保存したファイルのハッシュ
        path:
          type: string
          description: 保存したファイルの道
        effective:
          type: string
          description: 使われる置き場所
        hidden:
          type: array
          description: 別の置き場所の文書に隠れている置き場所
          items:
            type: string
        items:
          type: array
          description: 保存のあとのロールの一覧
          items:
            $ref: "#/components/schemas/RoleItem"
        hashes:
          type: object
          additionalProperties:
            type: string
          description: 置き場所とロール名ごとの、ロールの文書が入っているファイルのハッシュ
    RoleDraft:
      description: 欄の下書きとして送るロールの文書。書かない欄は省くか null を送る。
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: ロール名
        title:
          type: string
          description: 文書の題
        revision:
          type: integer
          nullable: true
          description: 文書のバージョン
        sections:
          type: array
          nullable: true
          description: 文書の節
          items:
            $ref: "#/components/schemas/RoleDraftSection"
        hash:
