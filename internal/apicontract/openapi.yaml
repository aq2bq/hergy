      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HQAddProjectRequest'
      responses:
        "200":
          description: 追加後のプロジェクト一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HQProjects'
        "403":
          description: 書き込みを許可できない
          content:
            text/plain:
              schema:
                type: string
                description: 断った理由
        "422":
          description: 要求を読めないか、プロジェクトを並べられない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
        "503":
          description: 本部を読めない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refusal'
    delete:
