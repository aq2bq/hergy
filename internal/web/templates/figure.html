{{define "figure"}}
<figure class="fig">
<svg viewBox="0 0 {{.Width}} {{.Height}}" role="img" aria-label="{{t "web.figure.label"}}">
  <defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path class="head" d="M0,0 L7,3 L0,6 z"/></marker></defs>
  {{- if .Human.Href}}<a href="{{.Human.Href}}" class="node human{{if .Human.Open}} open{{end}}{{if .Human.Problem}} problem{{end}}">{{else}}<g class="node human{{if .Human.Open}} open{{end}}{{if .Human.Problem}} problem{{end}}">{{end}}
    <rect class="box" x="{{.Human.X}}" y="{{.Human.Y}}" width="{{.Human.W}}" height="{{.Human.H}}" rx="8"/>
    <text class="nm" x="{{.Human.NameX}}" y="{{.Human.NameY}}">{{.Human.Name}}</text>
    {{- if .Human.Problem}}<title>{{.Human.Problem}}</title>{{end}}
  {{- if .Human.Href}}</a>{{else}}</g>{{end}}
  {{- range .Members}}
  {{- if .Href}}<a href="{{.Href}}" class="node{{if .Open}} open{{end}}{{if .State}} {{.State}}{{end}}{{if .Problem}} problem{{end}}">{{else}}<g class="node{{if .Open}} open{{end}}{{if .State}} {{.State}}{{end}}{{if .Problem}} problem{{end}}">{{end}}
    <rect class="box member {{.Class}}" x="{{.X}}" y="{{.Y}}" width="{{.W}}" height="{{.H}}" rx="8"/>
    <text class="nm" x="{{.NameX}}" y="{{.NameY}}">{{.Name}}</text>
    <text class="sub" x="{{.SubX}}" y="{{.SubY}}">{{.Sub}}</text>
    {{- if .Problem}}<title>{{.Problem}}</title>{{end}}
  {{- if .Href}}</a>{{else}}</g>{{end}}
  {{- range .Workers}}
  {{- if .Href}}<a href="{{.Href}}" class="node{{if .Open}} open{{end}}">{{else}}<g class="node{{if .Open}} open{{end}}">{{end}}
    <rect class="box worker" x="{{.X}}" y="{{.Y}}" width="{{.W}}" height="{{.H}}" rx="6"/>
    <text class="nm" x="{{.NameX}}" y="{{.NameY}}">{{.Name}}</text>
    <text class="sub" x="{{.SubX}}" y="{{.SubY}}">{{.Sub}}</text>
  {{- if .Href}}</a>{{else}}</g>{{end}}
  {{- end}}
  {{- end}}
  {{- range .Edges}}
  {{- if .Href}}<a href="{{.Href}}" class="edge-link{{if .Open}} open{{end}}"><path class="edge{{if .Worker}} worker{{end}}{{if .Fade}} pending-remove{{end}}" d="{{.Path}}" data-from="{{.DataFrom}}" data-to="{{.DataTo}}" marker-end="url(#head)"><title>{{.Label}}</title></path></a>{{else}}<g class="edge-link{{if .Open}} open{{end}}"><path class="edge{{if .Worker}} worker{{end}}{{if .Fade}} pending-remove{{end}}" d="{{.Path}}" data-from="{{.DataFrom}}" data-to="{{.DataTo}}" marker-end="url(#head)"><title>{{.Label}}</title></path></g>{{end}}
  {{- end}}
  {{- range .Pending}}
  <path class="edge pending-add" d="{{.Path}}" marker-end="url(#head)"><title>{{.Label}}</title></path>
  {{- end}}
  {{- range .Handles}}
  <a class="handle" href="{{.Href}}" aria-label="{{.Title}}"><circle cx="{{.X}}" cy="{{.Y}}" r="10"/><text x="{{.X}}" y="{{.Y}}" text-anchor="middle" dominant-baseline="central">{{.Label}}</text><title>{{.Title}}</title></a>
  {{- end}}
</svg>
</figure>
{{end}}
