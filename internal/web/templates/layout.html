<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
<title>hergy · {{.Title}}</title>
<link rel="stylesheet" href="/static/hergy.css">
<script src="/static/htmx-2.0.4.min.js" defer></script>
<script src="/static/copy.js" defer></script>
<script src="/static/ui.js" defer></script>
</head>
<body hx-boost="true" hx-target="#main" hx-select="#main" hx-swap="outerHTML" hx-push-url="true">
<div class="app">
<header class="top">
  <a class="brand" href="/" aria-label="hergy">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72.7 26" width="72.7" height="26" role="img"><title>hergy</title><g transform="translate(1 0)"><rect class="hg-dot" x="0" y="6" width="4" height="4"/><rect class="hg-dot" x="0" y="18" width="4" height="4"/><rect class="hg-dot" x="6" y="9" width="4" height="4"/><rect class="hg-dot" x="6" y="15" width="4" height="4"/><rect class="hg-lead" x="12" y="12" width="4" height="4"/></g><path class="hg-ink" d="M25.0 3V19M25.0 10H32.0V19M42.3 18H35.3V10H42.3V14H35.3M45.599999999999994 19V9M45.599999999999994 10H51.099999999999994M61.39999999999999 10H54.39999999999999V18H61.39999999999999M61.39999999999999 9V23H54.39999999999999M64.69999999999999 9V18H71.69999999999999M71.69999999999999 9V23H64.69999999999999" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"/></svg>
  </a>
  <nav class="band" aria-label="{{t "web.band"}}">
    {{- range .Bands}}
    <a href="{{.Href}}"{{if .Active}} aria-current="page"{{end}}>{{.Name}}</a>
    {{- end}}
  </nav>
</header>
<main id="main">
  {{- if .Crumb}}
  <nav class="crumb" aria-label="{{t "web.crumb"}}">
    {{- range $i, $c := .Crumb}}{{if $i}} <span class="sep" aria-hidden="true">›</span> {{end}}{{if $c.Href}}<a href="{{$c.Href}}">{{$c.Name}}</a>{{else}}<b>{{$c.Name}}</b>{{end}}{{end}}
  </nav>
  {{- end}}
  {{.Body}}
</main>
</div>
<input type="hidden" id="run-token" value="{{.Token}}">
</body>
</html>
