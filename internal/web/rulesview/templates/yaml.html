{{define "yaml-tab"}}
<div class="copy-row">
  <span>{{t "web.rules.yaml.lede"}}</span>
  <button class="btn" type="button" data-copy="#yaml-src" data-copied="{{t "web.copy.done"}}">{{t "web.copy"}}</button>
</div>
<div class="code"><pre id="yaml-src">{{.YAML.Source}}</pre></div>
<h3 class="sect">{{t "web.rules.yaml.check"}}</h3>
{{- if .YAML.OK}}
<p class="lede">{{t "web.rules.yaml.ok"}}</p>
{{- else}}
<div class="code check"><pre>{{.YAML.Check}}</pre></div>
{{- end}}
{{end}}
