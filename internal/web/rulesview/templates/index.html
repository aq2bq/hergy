{{define "index.html"}}
{{- if .Groups}}
<nav class="docs" aria-label="{{t "web.rules.title"}}">
{{- range .Groups}}
  <section class="doc-group">
    <h2>{{.Label}}</h2>
    <ul class="doc-list">
    {{- range .Rows}}
      <li><a class="doc{{if .Selected}} on{{end}}{{if .Broken}} broken{{end}}" href="{{.Href}}"{{if .Selected}} aria-current="true"{{end}}>{{.Label}}{{if .Broken}}<span class="tag">{{t "web.rules.doc.broken"}}</span>{{else}}<span class="doc-sum">{{tf "web.rules.doc.summary" .Total .Origin}}</span>{{end}}</a></li>
    {{- end}}
    </ul>
  </section>
{{- end}}
</nav>
{{- else}}
<p class="empty">{{t "web.rules.empty"}}</p>
{{- end}}
{{end}}
