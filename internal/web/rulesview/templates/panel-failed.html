{{define "panel-failed.html"}}
<aside class="drawer" id="{{drawerid}}" aria-label="{{t "web.rules.panel.title"}}">
  <div class="dr-head">
    <span class="dr-crumb">{{t "web.rules.panel.title"}}</span>
    <button class="x" type="button" aria-label="{{t "web.rules.panel.close"}}"
            hx-get="{{p "panel"}}?close=1&amp;layer={{.Layer}}&amp;doc={{.Doc}}" hx-target="{{panelid}}" hx-swap="outerHTML">×</button>
  </div>
  <div class="dr-body">
    <p class="problem">{{tf "web.rules.panel.failed" .Reason}}</p>
  </div>
</aside>
{{end}}
