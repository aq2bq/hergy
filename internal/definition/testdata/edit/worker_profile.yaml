# このチームの定義
# コメントだらけの team.yaml。触らない行が 1 字も変わらないことを見る
version: 1
description: "いまの説明" # 説明は 1 行
# メンバーは 2 人
members:
  # 進行を見る lead
  - name: lead
    role: "lead" # ロールは引用してある
    profile: planner
  # 仕様を書く spec
  - name: spec
    role: spec
    profile: reviewer
# 誰が誰に渡すか
turns:
  - human -> lead
  - lead -> spec
  - spec -> lead
  - lead -> human
# 呼べるワーカー
workers:
  - from: lead
    purpose: 実装
    profile: coder
  - from: spec
    purpose: 調査
    profile: coder
