version: 1
sections:
  - heading: Team agreements
    rules:
      - text: Work along the gy-loop skill, so that work can resume from gy when a conversation ends.
        note: "Sessions end. An agreement that lives only in a conversation is lost."
      - text: Hand the turn to whoever acts next, along with what you need from them.
        note: "When nobody holds the turn, the team stops. Without knowing what is needed, the receiver does not know what to do."
