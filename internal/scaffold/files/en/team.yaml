version: 1
# description is required: one line saying which case this team is meant for. The
# places a person picks a definition (the team list, a definition's screen, the
# start sheet and hergy show) read it. Write your own here.
description: which case this team is meant for, in one line
members:
  - name: lead
    role: lead
    profile: claude-default
  - name: builder
    role: builder
    profile: claude-default
# turns: who hands the turn to whom (human, or a member by name)
turns:
  - human -> lead
  - lead -> builder
  - builder -> lead
  - lead -> human
