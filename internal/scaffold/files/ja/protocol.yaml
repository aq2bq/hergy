version: 1
sections:
  - heading: チームの約束
    style: ids
    rules:
      - id: C1
        text: gy-loop スキルに従い、会話が切れても gy から続けられるようにする。
        why: セッションは切れる。会話にしかない合意は残らない。
        send_why: false
      - id: C2
        text: 求めることを添えて、次に動く相手へ手番を渡す。
        why: 誰も手番を持たないとチームが止まる。求めることが無いと、相手は何をすればよいか分からない。
        send_why: false
