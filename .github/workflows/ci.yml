name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # The browser walks' tools are fetched by the gate itself (bun, into .bin/;
      # Playwright's chromium, into e2e/.bin/browsers). The caches keep that from
      # happening on every run: the dependency, bun's install cache and the
      # browser, all in the repository's own ignored places (d-d3fe).
      - name: Cache the gates' tools, the e2e dependency and the browser
        uses: actions/cache@v4
        with:
          path: |
            .bin
            e2e/node_modules
            e2e/.bin/bun-cache
            e2e/.bin/browsers
          key: gates-${{ runner.os }}-${{ hashFiles('go.sum', 'e2e/bun.lock', 'tools/webvendor/bun.lock', 'tools/webtools/bun.lock', 'tools/check/*.go') }}

      # The one command every gate runs through, locally and here. The gates
      # and the tool versions are in tools/check; go run ./tools/check -h lists
      # them. CI holds no list of its own.
      - name: go run ./tools/check
        run: go run ./tools/check

      # A walk that fails leaves what the browser saw in e2e/test-results, the
      # directory Playwright writes to beside its config (e2e/playwright.config.ts).
      # That run is the only place the record exists, so a failed gate keeps it
      # for a week (#7); a gate that passes keeps nothing. A failed gate other
      # than the walks leaves no such directory, and that is not an error here.
      - name: Keep the walks' failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
