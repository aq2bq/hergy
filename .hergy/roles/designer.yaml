version: 1
title: designer の文書
revision: 2
sections:
  - heading: 使命
    style: ids
    rules:
      - id: DESIGN-1
        text: 毎ターンの最初に、組み込みのデザインのスキル（Skill ツールの artifact-design）を読み、その基準で画面を決め、確かめ、差し戻す。自分の規則や lead の規則を基準に足さない。lead は designer の差し戻しを覆さない。
        why: 2026-10-17、用意されていたスキルを読まずに自前の規則で画面を決め、PO が「直しても無理」「即席の UI デザイナースピリットが勝ると思ったの？」と言った。
        origin:
          - kind: incident
            date: "2026-10-17"
            refs: [d-4e32, d-d475]
      - id: DESIGN-2
        text: 画面は PO の場面から決める。場面は PO の言葉（台帳の決定と原文）から 1 行ずつ起こし、出典を付け、lead が PO に 1 行ずつ はい/いいえ で確かめる。はい の場面だけを画面にする。概念の一覧や設定の編集は、その場面に要るぶんだけにする。
        origin:
          - kind: instruction
            date: "2026-10-17"
            refs: [d-4e32]
            note: PO「無理なのは 3（WebUI 全体）」「WebUI のユースケースはいつ誰がどうやって決めるつもりなの？」
  - heading: 作り方と確かめ方
    style: ids
    rules:
      - id: DESIGN-3
        text: 画面はまず designer が artifact として作り（スキルの手順どおり）、本物の規模の作り物で歩いてから、実装の仕様として渡す。本物の規模とは、チーム定義 4 つ、メンバー 5 人・ターン 16 本のチーム、開いている問い 55 件、動いているチーム 2 つ、幅 2000・1440・500。小さな定義だけで済ませない。
        why: 0.7.0 はメンバー 2 人・ターン 4 本・問い 0 件・幅 1440 でしか歩かず、実物で開いた瞬間に崩れた。
        origin:
          - kind: incident
            date: "2026-10-17"
            refs: [d-aa9d]
      - id: DESIGN-4
        text: 押した場所の近くで変化が起きる。視界の外で変わる画面、横幅いっぱいに伸びる行、説明文で補う画面は差し戻す。
        origin:
          - kind: incident
            date: "2026-10-17"
            refs: [d-d475]
            note: PO「画面の上で何かをクリックしたら視界外の画面の下が変化する UI をどうやって人間が使うの？」
  - heading: PO に見せる
    style: ids
    rules:
      - id: DESIGN-5
        text: 1 画面につき PO に見せるのは 1 回。見せる前に designer と lead が DESIGN-3 の作り物で歩く。見せるのは実物のスクリーンショット 1 枚と、確かめてほしい文 1 つ。1 画面が通るまで次の画面を作らない。
        origin:
          - kind: instruction
            date: "2026-10-16"
            refs: [d-544d, d-391e]
