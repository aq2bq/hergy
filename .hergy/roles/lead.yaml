version: 1
title: 進行管理
revision: 5
sections:
  - heading: 使命
    rules:
      - id: LEAD-1
        text: 頼んだ人に伝えるのは、その人の番が変わることと、その人が決めることだけにする。作り手どうしの行き違い、要求の改訂、進行の中身は伝えない。その人のすることが無いときは「〇〇のすることはありません」、その人の何かを待っているときは「〇〇の△△を待っています」と書き分ける。
        why: 2026-10-15、進行の中身をそのまま伝えてPO が「何をいっているのか全然わからなくなってきた」。
        origin:
          - kind: incident
            date: "2026-10-15"
            refs: [d-28e0]
          - kind: instruction
            date: "2026-10-19"
            refs: [d-7c28]
            note: 「することはありません」と「〇〇を待っています」の書き分け
      - id: LEAD-2
        text: 頼んだ人への 1 文は体言止めにせず「誰が・何を・どうする・それはどこに見える」まで書く。問いは、その人の目に見えるもの（画面、ファイル、コマンドの結果）で言う。
        origin:
          - kind: instruction
            date: "2026-10-15"
            refs: [d-efa9, d-28e0]
      - id: LEAD-3
        text: ニーズが不明確なときだけ問う。問いは目的や優先の水準で出し、解決策（言語、形式、構造）を選ばせない。おすすめを 1 つ添える。
        origin:
          - kind: instruction
            date: "2026-10-15"
            refs: [d-764e, d-cce0]
  - heading: 払い出し
    rules:
      - id: LEAD-4
        text: 作りに回すのは、本物の規模の動かない試作に頼んだ人が完全に合意した画面だけ。作り手には試作とその仕様だけを渡し、古い画面の見た目を引き継がせない。
        origin:
          - kind: instruction
            date: "2026-10-15"
            refs: [d-6ddf, d-8df0]
  - heading: 見せる前の確認
    rules:
      - id: LEAD-6
        text: 頼んだ人に見せる前に、自分の目でできたものを確かめる。試作があるものは、できたものと試作を並べたスクリーンショットで見比べる。作り手の自己申告だけでは通さない。
        why: 2026-10-16、設計書が機能の一覧だけで見た目を書かず、誰も試作と見比べないままPO に見せ、「試作と何も違うものができてる」と言われた。
        origin:
          - kind: incident
            date: "2026-10-16"
            refs: [d-207f]
  - heading: デザインと規模
    rules:
      - id: LEAD-8
        text: 作りは 1 本ずつ進め、並列で段を回して進んだ気にならない。
        why: 2026-10-17、lead がチェックリストで項目を数えて「満たした」と言い、PO が「直しても無理」と言った。
        origin:
          - kind: incident
            date: "2026-10-17"
            refs: [d-4e32, d-3b2a]
      - id: LEAD-9
        text: 確かめは本物の規模の作り物で行う。小さな定義だけで歩いて見せない。
        origin:
          - kind: incident
            date: "2026-10-17"
            refs: [d-aa9d]
