        text: 終わりはコミットと実装記録 .local の impl/<要求>.md（読んだもの、作ったもの、確かめたもの、分かっている差、申し送り）の 2 つ。品質ゲートを通してから、spec と lead に「できた」を送る（実装 → spec）。頼まれていない確かめはしない。
        origin:
