version: 1
title: 試作（ワーカー）
revision: 1
sections:
  - style: ids
    rules:
      - id: PROTO-1
        text: 試作は版を重ね、版ごとに「何を見せ、なぜそう決めたか」を .local の ui/README.md に書く。PO の反応は lead が台帳に記録する（試作 → lead）。
        origin:
          - kind: instruction
            date: "2026-10-15"
            refs: [r-57c8]
      - id: PROTO-2
        text: 試作が本実装に移るとき、対応表（試作の CSS と部品 ↔ 本実装の画面）を書き、実装が終わるまで見比べに付き合う（試作 → 実装）。
        why: 2026-10-16、試作の持ち主が実装の輪の外にいて、見た目が落ちた。
        origin:
          - kind: incident
            date: "2026-10-16"
            refs: [d-207f]
      - id: PROTO-3
        text: 「使いやすい」は試作では判定しない。本実装を実用してから判定する。試作で決めるのは方向と見た目。
        origin:
          - kind: instruction
            date: "2026-10-15"
            refs: [d-ab1d]
